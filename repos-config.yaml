          nilaway-version: "latest"
          nilaway-include-pkgs: "github.com/blinklabs-io/go-scls"

      - destination_file: go-test-cmd-scls.yml
        workflow_name: "Go checks (cmd/scls module)"
        reusable_workflow: "blinklabs-io/shared-actions/.github/workflows/reuseable-go-test.yml@d90d0eef9c2d00ecac430e1b184ac2993ac768fb"
        triggers:
          pull_request:
          push:
            branches: [main]
            tags: ['v*']
        params:
          test-flags: "-race"
          working-directory: "cmd/scls"
          run-golangci-lint: "true"
          run-nilaway: "true"
          nilaway-version: "latest"
          nilaway-include-pkgs: "github.com/blinklabs-io/go-scls/cmd/scls"

      - destination_file: publish.yml
        workflow_name: publish
        reusable_workflow: "blinklabs-io/shared-actions/.github/workflows/reuseable-publish.yml@d90d0eef9c2d00ecac430e1b184ac2993ac768fb"
        triggers:
