  # adder is a Go service with a desktop GUI tray (Fyne/CGO) and platform
  # installers (Windows MSI, macOS .pkg). Its release pipeline (macOS
  # signed+notarized .pkg, Windows signed .msi, Linux/FreeBSD tarballs, native
  # multi-arch Docker images, and per-artifact build-provenance attestations) is
  # driven by the shared reuseable-publish-desktop.yml workflow below. The
  # repo-specific packaging scripts (packaging/macos/build-pkg.sh,
  # packaging/windows/build-msi.ps1) and Makefile targets that workflow invokes
  # remain in-repo. test-msi.yml is a manual (workflow_dispatch) MSI smoke-test
  # harness with no shared equivalent, so it stays managed in-repo. The CI
  # checks below use the shared reusable workflows, passing adder's Fyne system
  # dependencies and CGO requirements.
  - name: blinklabs-io/adder
    <<: *repository-standard
    workflows:
      - <<: *conventional-commits
        reusable_workflow: "blinklabs-io/shared-actions/.github/workflows/reuseable-conventional-commits.yml@7328ad66dec3a12676f5a9d1948fa74946712613"

      - <<: *go-test-standard
        pipeline: ci.yml
        pipeline_name: ci
        reusable_workflow: "blinklabs-io/shared-actions/.github/workflows/reuseable-go-test.yml@7328ad66dec3a12676f5a9d1948fa74946712613"
        params:
          <<: *go-test-standard-params
          go-versions: '["1.26.x","1.27.x"]'
          platforms: '["ubuntu-26.04","windows-latest"]'
          system-dependencies: "libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev wayland-protocols"
          pre-test-command: "make build"
          test-flags: "-v -timeout 10m"
          windows-test-packages: "./tray/setup/..."
          test-env: "LANG=en_US.UTF-8"
          golangci-platform: "ubuntu-26.04"
          golangci-cgo-enabled: "true"
          nilaway-platform: "ubuntu-26.04"
          nilaway-cgo-enabled: "true"
          nilaway-include-pkgs: "github.com/blinklabs-io/adder"
          nilaway-exclude-pkgs: "github.com/go-gl/glfw"

      - <<: *docker-ci
        reusable_workflow: "blinklabs-io/shared-actions/.github/workflows/reuseable-ci-docker-multiarch.yml@7328ad66dec3a12676f5a9d1948fa74946712613"
        triggers:
          pull_request:
            branches: [main]
            paths:
              - Dockerfile
              - cmd/**
              - docs/**
              - internal/**
              - go.*
              - .github/workflows/ci-docker.yml
        params:
          image-name: "blinklabs-io/adder"

      - destination_file: publish.yml
        pipeline: ci.yml
        needs: [go-test]
        if: github.event_name == 'push'
        workflow_name: "publish"
        # Pinned to an immutable commit SHA (not @main): this call hands the
        # reusable Apple, Google Cloud KMS, and Docker credentials plus
        # release/package write access, so it must reference a reviewed, frozen
        # revision. Bump this SHA in a reviewed change when adopting new
        # desktop-publish behavior.
        #
        # IMPORTANT: this repo squash-merges PRs, so a PR-branch commit SHA is
        # NOT replayed onto main and is unreachable once the branch is deleted.
        # GitHub Actions cannot resolve a reusable workflow at an unreachable
        # SHA ("cannot find workflow"), which fails the caller before any job is
        # created. Always pin to a commit that lands on main (the squash/merge
        # commit), never to a feature-branch commit.
        reusable_workflow: "blinklabs-io/shared-actions/.github/workflows/reuseable-publish-desktop.yml@7328ad66dec3a12676f5a9d1948fa74946712613"
        triggers:
          push:
            branches: [main]
            tags: ['v*.*.*']
        # Union of the capabilities the reusable's jobs actually need:
        # attestations + id-token (build provenance), contents (release
        # create/undraft and asset uploads), packages (image push), and
        # security-events (Trivy SARIF upload). Individual jobs narrow further.
        permissions:
          attestations: write
          contents: write
          id-token: write
          packages: write
          security-events: write
        secrets:
          # Docker Hub
          docker-password: DOCKER_PASSWORD
          # Apple Developer ID signing + notarization (macOS .pkg)
          apple-certificate: APPLE_CERTIFICATE
          apple-certificate-password: APPLE_CERTIFICATE_PASSWORD
          apple-installer-certificate: APPLE_INSTALLER_CERTIFICATE
          # adder reuses the application-cert password for the installer cert.
          apple-installer-certificate-password: APPLE_CERTIFICATE_PASSWORD
          apple-keychain-password: APPLE_KEYCHAIN_PASSWORD
          apple-id: APPLE_ID
          apple-app-specific-password: APPLE_APP_SPECIFIC_PASSWORD
          apple-team-id: APPLE_TEAM_ID
          # Windows EV code signing via jsign + Google Cloud KMS (MSI)
          certificate-sa-credentials: CERTIFICATE_SA_CREDENTIALS
          certificate-chain: CERTIFICATE_CHAIN
          certificate-store-type: CERTIFICATE_STORE_TYPE
          certificate-keystore: CERTIFICATE_KEYSTORE
          certificate-key-name: CERTIFICATE_KEY_NAME
        params:
          application-name: "adder"
          docker-image: "blinklabs/adder"
          description: "Adder is a tool for tailing the Cardano blockchain and emitting events"
          # Preserve the capitalized Authenticode display name the in-repo
          # workflow used (application-name is lowercase "adder").
          windows-signing-name: "Adder"
          # The default rows minus darwin/amd64: stapler validation of the
          # Intel .pkg fails reproducibly on macos-15-intel runners, so adder
          # ships macOS for Apple silicon only.
          binary-target-matrix: '[{"runner":"macos-15","os":"darwin","arch":"arm64","tray":true},{"runner":"ubuntu-26.04","os":"freebsd","arch":"amd64","tray":false},{"runner":"ubuntu-26.04","os":"freebsd","arch":"arm64","tray":false},{"runner":"ubuntu-26.04","os":"linux","arch":"amd64","tray":true},{"runner":"ubuntu-26.04-arm","os":"linux","arch":"arm64","tray":true},{"runner":"windows-latest","os":"windows","arch":"amd64","tray":true},{"runner":"windows-11-arm","os":"windows","arch":"arm64","tray":true}]'
      - destination_file: release-fanout.yml
        workflow_name: "release-fanout"
        reusable_workflow: "blinklabs-io/shared-actions/.github/workflows/reuseable-release-dispatch.yml@7328ad66dec3a12676f5a9d1948fa74946712613"
        triggers:
          workflow_run:
            types: [completed]
            workflows: [ci]
        permissions:
          contents: read
        secrets:
          token: ORG_PROJECT_PAT
    release_fanout:
      - repo: blinklabs-io/ansible-cardano
        type: ansible-role
        role: adder
        refs: [roles/adder/README.md]
  # adder-mobile is a Flutter mobile app (not a Go service). It uses the shared
  # conventional-commits check plus the shared reusable Flutter CI workflow for
  # PR analyze/test (pr.yml) and the main-branch release APK build (publish.yml).
  # The APK build writes android/app/google-services.json from the
  # GOOGLE_SERVICES_JSON secret and uploads the versioned APK artifact. Store
  # signing / app-store release packaging is not handled by the shared workflow
  # and would remain repository-specific if added later.
  - name: blinklabs-io/adder-mobile
    settings:
      delete_branch_on_merge: true
    collaborators: []
    branch_protection:
      - branch: main
        <<: *branch_protection_defaults
    workflows:
      - destination_file: conventional-commits.yml
        workflow_name: "Conventional Commits"
        reusable_workflow: "blinklabs-io/shared-actions/.github/workflows/reuseable-conventional-commits.yml@d90d0eef9c2d00ecac430e1b184ac2993ac768fb"
        triggers:
          pull_request:
        permissions:
          contents: read

      - destination_file: pr.yml
        workflow_name: "PR"
        reusable_workflow: "blinklabs-io/shared-actions/.github/workflows/reuseable-flutter.yml@d90d0eef9c2d00ecac430e1b184ac2993ac768fb"
        triggers:
          pull_request:
        params:
          flutter-version: "3.22.0"
          channel: "stable"
          run-analyze: "true"
          run-tests: "true"
          build-apk: "false"

      - destination_file: publish.yml
        workflow_name: "Build Flutter APK"
        reusable_workflow: "blinklabs-io/shared-actions/.github/workflows/reuseable-flutter.yml@f0bde4fe4b4d229840d0dcd9bae60da0ecd90074"
        triggers:
          push:
            branches: [main]
        secrets:
          GOOGLE_SERVICES_JSON: GOOGLE_SERVICES_JSON
        params:
          java-version: "'17'"
          flutter-version: "3.22.0"
          channel: "stable"
          run-analyze: "false"
          run-tests: "false"
          build-apk: "true"
          create-google-services: "true"
          apk-artifact-name: "app-${{ github.ref_name }}-release.apk"

  # bursa is a Cardano wallet monorepo: a Go service/CLI, a Node+Go embedded web
  # UI (ui.yml), gomobile Android/iOS apps (mobile.yml, mobile-contracts.yml),
  # and a CGO webview desktop wallet. Go CI is combined in the shared test
  # workflow, which now supports the root Postgres service, tagged PKCS#11
  # tests, explicit cross-build targets, the openapi module, and NilAway across
  # the root and ui modules. The remaining repository-specific workflows are:
  #   - ci-docker.yml bundles a repo-specific image-manifest-script job beside
  #     the multi-arch build; the reusable renders only the build job.
  #   - publish.yml does Apple notarization, Windows KMS/jsign signing, the
  #     webview desktop wallet (.pkg/.msi/webkit2gtk), and release provenance.
  #   - ui.yml (Node web bundle + embedded Go) and mobile.yml /
  #     mobile-contracts.yml (gomobile Android/iOS) have no shared equivalent.
  - name: blinklabs-io/bursa
    profile: go-ci-standard
    overrides:
      go-test.yml:
        # Pull requests only: a push to main or a tag re-ran the suite the pull
        # request had just passed, and publish.yml does not depend on it.
        triggers:
          pull_request:
        concurrency:
          group: '${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}'
          cancel_in_progress: "true"
        params:
          go-versions: '["1.26.x","1.27.x"]'
          verify-modules: "true"
          run-vet: "true"
          nilaway-version: "latest"
          nilaway-include-pkgs: "github.com/blinklabs-io/bursa"
          nilaway-additional-working-directories: "ui"
          golangci-additional-working-directories: "openapi"
          additional-module-directories: "openapi"
          extra-test-packages: "./internal/signer/..."
          extra-test-flags: "-tags pkcs11 -race"
          test-env: |-
            BURSA_TEST_POSTGRES_DSN=postgres://postgres:postgres@127.0.0.1:5432/bursa_test?sslmode=disable
          services: |-
            {"postgres":{"image":"postgres:16","env":{"POSTGRES_DB":"bursa_test","POSTGRES_PASSWORD":"postgres","POSTGRES_USER":"postgres"},"ports":["5432:5432"],"options":"--health-cmd \"pg_isready -U postgres -d bursa_test\" --health-interval 10s --health-timeout 5s --health-retries 5"}}
          cross-build-go-version: "1.26.x"
          build-packages: "./cmd/bursa"
          cross-build-targets: '[{"os":"darwin","arch":"arm64"},{"os":"freebsd","arch":"amd64"},{"os":"freebsd","arch":"arm64"},{"os":"linux","arch":"amd64"},{"os":"linux","arch":"arm64"},{"os":"windows","arch":"amd64"},{"os":"windows","arch":"arm64"}]'

  # dingo is a Cardano node written in Go. Like bursa, its CI/release surface is
  # a hand-tuned monorepo pipeline that the shared reusable workflows cannot
  # express without dropping behavior, so only the one check that maps 1:1 onto
  # a reusable — conventional-commits — is migrated here. The rest stay
  # hand-maintained in-repo:
  #   - go-test.yml (the `ci` pipeline) is a staged fan-out (lint + govulncheck
  #     -> quick SQLite suite -> Postgres/MySQL/MinIO service-container suite,
  #     race suite, macOS suite -> per-OS builds) tuned to the org's 20-job
  #     concurrency cap; reuseable-go-test.yml runs a single flat job and cannot
  #     provision service containers or gate stages with `needs:`.
  #   - publish.yml duplicates those same stages ahead of signed release jobs
  #     (Apple notarization, provenance attestations); `needs:` cannot cross
  #     workflow files, so it cannot be factored into a reusable, and
  #     internal/docsparity's TestPipelineStagesMatch enforces that the two
  #     files stay in lockstep.
  #   - lint runs golangci-lint across three Go modules (root,
  #     internal/test/antithesis, examples/dingo-gov-lens) plus `make
  #     config-parity`; reuseable-golangci-lint.yml scans only the root module,
  #     so migrating would silently drop the other two modules and the parity
  #     gate.
  #   - antithesis.yml (scheduled Antithesis fault-injection runs),
  #     benchmark.yml (weekly benchstat suite) and config-parity.yml (scheduled
  #     upstream-config drift report) are repo-specific and have no shared
  #     equivalent.
  #   - release_fanout lists the repositories that get the new version pushed
  #     on a published release through the explicit public dispatch wrapper.
  #     dingo itself is not a target: its own files hold no version string
  #     the refs rules rewrite.
  - name: blinklabs-io/dingo
    settings:
      delete_branch_on_merge: true
    collaborators: []
    branch_protection:
      - branch: main
        <<: *branch_protection_defaults
    workflows:
      - destination_file: conventional-commits.yml
        workflow_name: "Conventional Commits"
        # Dingo requires every reusable workflow reference to be immutable.
        reusable_workflow: "blinklabs-io/shared-actions/.github/workflows/reuseable-conventional-commits.yml@d90d0eef9c2d00ecac430e1b184ac2993ac768fb"
        triggers:
          pull_request:
        permissions:
          contents: read
      - destination_file: release-fanout.yml
        workflow_name: "release-fanout"
        reusable_workflow: "blinklabs-io/shared-actions/.github/workflows/reuseable-release-dispatch.yml@d90d0eef9c2d00ecac430e1b184ac2993ac768fb"
        triggers:
          workflow_run:
            types: [completed]
            workflows: [publish]
        permissions:
          contents: read
        secrets:
          token: ORG_PROJECT_PAT
    release_fanout:
      - repo: blinklabs-io/ansible-cardano
        type: ansible-role
        role: dingo
        refs:
          - roles/dingo/README.md
      - repo: blinklabs-io/helm-charts
        type: helm-chart
        chart: charts/dingo
        refs:
          - charts/dingo/README.md
      - repo: blinklabs-io/cardano-up-packages
        type: cardano-up-package
        package: dingo
      - repo: blinklabs-io/homebrew-cardano
        type: homebrew-formula
        formula: Formula/dingo.rb

  # cardano-compose-stacks provides Docker Compose stacks, including the Dingo
  # Antithesis harness and archive demo. The nested Go modules get independent
  # reusable CI workflows scoped to their paths. Its weekly image-version
  # checker uses the shared reusable workflow and the built-in github.token.
  - name: blinklabs-io/cardano-compose-stacks
    <<: *repository-standard
    workflows:
      - *conventional-commits

      - destination_file: check-versions.yml
        workflow_name: "check-versions"
        reusable_workflow: "blinklabs-io/shared-actions/.github/workflows/reuseable-check-versions.yml@d90d0eef9c2d00ecac430e1b184ac2993ac768fb"
        triggers:
          schedule:
          - cron: 0 0 * * 0
          workflow_dispatch:
        permissions:
          contents: write
          pull-requests: write

      - destination_file: antithesis-go-test.yml
        workflow_name: "Antithesis Go tests"
        reusable_workflow: *go-test-caller
        triggers:
          pull_request:
            paths:
              - antithesis/dingo-praos/**
          push:
            branches: [main]
            paths:
              - antithesis/dingo-praos/**
        params:
          <<: *go-test-standard-params
          working-directory: "antithesis/dingo-praos"
          test-flags: "-race"
          nilaway-version: "latest"

      - destination_file: archive-demo-go-test.yml
        workflow_name: "Archive demo Go checks"
        reusable_workflow: *go-test-caller
        triggers:
          pull_request:
            paths:
              - dingo-archive-demo/**
          push:
            branches: [main]
            paths:
              - dingo-archive-demo/**
        params:
          <<: *go-test-standard-params
          working-directory: "dingo-archive-demo"
          # Compile the Docker-backed suite without starting its local devnet.
          test-flags: "-race -tags=archive_demo -run=^$"
          nilaway-version: "latest"

  # cardano-up is a Go command line utility for managing Cardano services for
  # local development. Its CI (conventional commits, go-test, golangci-lint,
  # nilaway, Docker CI) and release/publish pipeline are migrated to the shared
  # reusable workflows. The reusable defaults for the Go toolchain and lint
  # versions match the repository's originals, so only the image/binary naming,
  # Docker Hub description, docker-password secret and the linux/darwin-only
  # binary matrix need to be provided.
  - name: blinklabs-io/cardano-up
    <<: *repository-standard
    workflows:
      - *conventional-commits

      - <<: *go-test-standard
        pipeline: ci.yml
        pipeline_name: ci
        params:
          <<: *go-test-standard-params
          nilaway-include-pkgs: "github.com/blinklabs-io/cardano-up"

      - <<: *docker-ci
        triggers:
          pull_request:
            branches: [main]
            paths:
              - Dockerfile
              - Makefile
              - cmd/**
              - docs/**
              - internal/**
              - pkgmgr/**
              - go.*
              - .github/workflows/ci-docker.yml
        params:
          image-name: "blinklabs-io/cardano-up"

      - <<: *go-service-publish
        # This workflow receives tap-write credentials, so pin its reviewed
        # revision.
        reusable_workflow: "blinklabs-io/shared-actions/.github/workflows/reuseable-publish.yml@d90d0eef9c2d00ecac430e1b184ac2993ac768fb"
        triggers:
          push:
            branches: [main]
            tags: ['v*.*.*']
        permissions: *go-service-publish-permissions
        secrets:
          docker-password: DOCKER_PASSWORD
          homebrew-tap-token: ORG_PROJECT_PAT
        params:
          binary-name: "cardano-up"
          docker-image: "blinklabs/cardano-up"
          description: "Command line utility for managing Cardano services for local development"
          binary-target-matrix: '[{"os":"linux","arch":"amd64"},{"os":"linux","arch":"arm64"},{"os":"darwin","arch":"amd64"},{"os":"darwin","arch":"arm64"}]'
          homebrew-tap-repository: "blinklabs-io/homebrew-cardano"
          homebrew-formula-path: "Formula/cardano-up.rb"
      - destination_file: release-fanout.yml
        workflow_name: "release-fanout"
        reusable_workflow: "blinklabs-io/shared-actions/.github/workflows/reuseable-release-dispatch.yml@d90d0eef9c2d00ecac430e1b184ac2993ac768fb"
        triggers:
          workflow_run:
            workflows: [ci]
            types: [completed]
        permissions:
          contents: read
        secrets:
          token: ORG_PROJECT_PAT
    release_fanout:
      - repo: blinklabs-io/cardano-up-packages
        type: cardano-up-package
        package: cardano-up

  # cardano-up-packages hosts the package definitions installed by the
  # cardano-up CLI. Three governed workflows:
  #   - conventional-commits: lints PR titles/commits.
  #   - package-validate: downloads the cardano-up CLI and validates the package
  #     definitions on pushes to main, version tags and pull requests.
  #   - check-versions: weekly (and manually triggerable) job that checks each
  #     package's upstream release (GitHub release, GHCR or Docker Hub image)
  #     against the newest local packages/<pkg>/<pkg>-*.yaml file and opens
  #     update PRs. This uses the packages-specific reusable check-versions
  #     workflow (distinct from the docker-compose one used by
  #     cardano-compose-stacks). It needs an org PAT so the opened PRs trigger
  #     downstream CI, so the workflow's `token` secret is mapped to
  #     ORG_PROJECT_PAT.
  - name: blinklabs-io/cardano-up-packages
    <<: *repository-standard
    workflows:
      - *conventional-commits

      - destination_file: package-validate.yml
        workflow_name: "package-validate"
        reusable_workflow: "blinklabs-io/shared-actions/.github/workflows/reuseable-package-validate.yml@d90d0eef9c2d00ecac430e1b184ac2993ac768fb"
        triggers:
          push:
            branches: [main]
            tags: ['v*']
          pull_request:

      - destination_file: check-versions.yml
        workflow_name: "check-versions"
        reusable_workflow: "blinklabs-io/shared-actions/.github/workflows/reuseable-check-versions-packages.yml@d90d0eef9c2d00ecac430e1b184ac2993ac768fb"
        triggers:
          schedule:
          - cron: 0 0 * * 0
          workflow_dispatch:
        permissions:
          contents: write
          pull-requests: write
        secrets:
          token: ORG_PROJECT_PAT
  # plutigo is a Go library (a Plutus interpreter). It uses git submodules for
  # test fixtures, so go-test enables submodules and runs one race pass without
  # coverage; nilaway skips a stack-machine docstring. benchmark.yml is repository-specific
  # and remains hand-maintained.
  - name: blinklabs-io/plutigo
    <<: *repository-standard
    workflows:
      - *conventional-commits

      - <<: *go-test-standard
        pipeline: ci.yml
        pipeline_name: ci
        triggers:
          workflow_dispatch:
          pull_request:
          push:
            branches: [main]
            tags: ['v*']
        params:
          <<: *go-test-standard-params
          submodules: "true"
          test-flags: "-race"
          nilaway-include-pkgs: "github.com/blinklabs-io/plutigo"
          nilaway-exclude-file-docstrings: "<nilaway skip stack-machine>"

      - &go-library-tag-publish
        destination_file: publish.yml
        pipeline: ci.yml
        needs: [go-test]
        if: github.event_name == 'push' && github.ref_type == 'tag'
        workflow_name: "publish"
        reusable_workflow: "blinklabs-io/shared-actions/.github/workflows/reuseable-go-library-release.yml@d90d0eef9c2d00ecac430e1b184ac2993ac768fb"
        triggers:
          push:
            tags: ['v*.*.*']
        # reuseable-go-library-release's publish-examples job statically
        # declares id-token/attestations write. GitHub validates a called
        # workflow's permission requirements at load time regardless of the
        # job's runtime if: gate, so the caller must grant the full set even
        # though plutigo leaves build-examples unset and never runs that job.
        permissions:
          contents: write
          id-token: write
          attestations: write
  # gouroboros is a Go library (the Ouroboros protocol). go-test.yml runs a
  # custom GOARCH matrix (amd64/386) with git submodules. benchmark.yml and
  # fuzz.yml remain repository-specific; the other checks map to the shared
  # reusable workflows.
  - name: blinklabs-io/gouroboros
    settings:
      delete_branch_on_merge: true
    collaborators: []
    branch_protection:
      - branch: main
        <<: *branch_protection_defaults
    workflows:
      - destination_file: conventional-commits.yml
        workflow_name: "Conventional Commits"
        reusable_workflow: "blinklabs-io/shared-actions/.github/workflows/reuseable-conventional-commits.yml@d90d0eef9c2d00ecac430e1b184ac2993ac768fb"
        triggers:
          pull_request:
        permissions:
          contents: read

      - destination_file: go-test.yml
        pipeline: ci.yml
        supersedes: [golangci-lint.yml, nilaway.yml]
        workflow_name: "go-test"
        reusable_workflow: "blinklabs-io/shared-actions/.github/workflows/reuseable-go-test.yml@d90d0eef9c2d00ecac430e1b184ac2993ac768fb"
        # No push to main: it re-ran the suite the pull request had just
        # passed. A tag still runs it, because publish needs it and the tagged
        # commit is otherwise never tested as itself.
        triggers:
          pull_request:
          push:
            tags: ['v*']
        concurrency:
          group: '${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}'
          cancel_in_progress: "true"
        permissions:
          contents: read
        params:
          go-arches: '["amd64","386"]'
          submodules: "true"
          run-golangci-lint: "true"
          run-nilaway: "true"
          nilaway-include-pkgs: "github.com/blinklabs-io/gouroboros"

      - destination_file: publish.yml
        pipeline: ci.yml
        needs: [go-test]
        if: github.event_name == 'push' && github.ref_type == 'tag'
        workflow_name: "publish"
        reusable_workflow: "blinklabs-io/shared-actions/.github/workflows/reuseable-go-library-release.yml@d90d0eef9c2d00ecac430e1b184ac2993ac768fb"
        triggers:
          push:
            tags: ['v*.*.*']
        permissions:
          contents: write
          id-token: write
          attestations: write
        params:
          submodules: "true"
