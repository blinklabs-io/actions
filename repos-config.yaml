  # bursa is a Cardano wallet monorepo: a Go service/CLI, a Node+Go embedded web
  # UI (ui.yml), gomobile Android/iOS apps (mobile.yml, mobile-contracts.yml),
  # and a CGO webview desktop wallet. Go CI is combined in the shared test
  # workflow, which now supports the root Postgres service, tagged PKCS#11
  # tests, explicit cross-build targets, the openapi module, and NilAway across
  # the root and ui modules. The remaining repository-specific workflows are:
  #   - ci-docker.yml bundles a repo-specific image-manifest-script job beside
  #     the multi-arch build; the reusable renders only the build job.
  #   - publish.yml does Apple notarization, Windows KMS/jsign signing, the
  #     webview desktop wallet (.pkg/.msi/webkit2gtk), and release provenance.
  #   - ui.yml (Node web bundle + embedded Go) and mobile.yml /
  #     mobile-contracts.yml (gomobile Android/iOS) have no shared equivalent.
  - name: blinklabs-io/bursa
    settings:
      delete_branch_on_merge: true
    collaborators: []
    branch_protection:
      - branch: main
        <<: *branch_protection_defaults
    workflows:
      - destination_file: go-test.yml
        supersedes: [golangci-lint.yml, nilaway.yml]
        workflow_name: go-test
        reusable_workflow: "blinklabs-io/actions/.github/workflows/reuseable-go-test.yml@main"
        triggers:
          push:
            branches: [main]
            tags: ['v*']
          pull_request:
        params:
          go-versions: '["1.26.x"]'
          verify-modules: "true"
          run-vet: "true"
          run-golangci-lint: "true"
          run-nilaway: "true"
          nilaway-version: "latest"
          nilaway-include-pkgs: "github.com/blinklabs-io/bursa"
          nilaway-additional-working-directories: "ui"
          golangci-additional-working-directories: "openapi"
          additional-module-directories: "openapi"
          extra-test-packages: "./internal/signer/..."
          extra-test-flags: "-tags pkcs11 -race"
          test-env: |-
            BURSA_TEST_POSTGRES_DSN=postgres://postgres:postgres@127.0.0.1:5432/bursa_test?sslmode=disable
          services: |-
            {"postgres":{"image":"postgres:16","env":{"POSTGRES_DB":"bursa_test","POSTGRES_PASSWORD":"postgres","POSTGRES_USER":"postgres"},"ports":["5432:5432"],"options":"--health-cmd \"pg_isready -U postgres -d bursa_test\" --health-interval 10s --health-timeout 5s --health-retries 5"}}
          cross-build-go-version: "1.26.x"
          build-packages: "./cmd/bursa"
          cross-build-targets: '[{"os":"darwin","arch":"arm64"},{"os":"freebsd","arch":"amd64"},{"os":"freebsd","arch":"arm64"},{"os":"linux","arch":"amd64"},{"os":"linux","arch":"arm64"},{"os":"windows","arch":"amd64"},{"os":"windows","arch":"arm64"}]'

      - destination_file: conventional-commits.yml
        workflow_name: "Conventional Commits"
        reusable_workflow: "blinklabs-io/actions/.github/workflows/reuseable-conventional-commits.yml@main"
        triggers:
          pull_request:

  # dingo is a Cardano node written in Go. Like bursa, its CI/release surface is
  # a hand-tuned monorepo pipeline that the shared reusable workflows cannot
  # express without dropping behavior, so only the one check that maps 1:1 onto
  # a reusable — conventional-commits — is migrated here. The rest stay
  # hand-maintained in-repo:
  #   - go-test.yml (the `ci` pipeline) is a staged fan-out (lint + govulncheck
  #     -> quick SQLite suite -> Postgres/MySQL/MinIO service-container suite,
  #     race suite, macOS suite -> per-OS builds) tuned to the org's 20-job
  #     concurrency cap; reuseable-go-test.yml runs a single flat job and cannot
  #     provision service containers or gate stages with `needs:`.
  #   - publish.yml duplicates those same stages ahead of signed release jobs
  #     (Apple notarization, provenance attestations); `needs:` cannot cross
  #     workflow files, so it cannot be factored into a reusable, and
  #     internal/docsparity's TestPipelineStagesMatch enforces that the two
  #     files stay in lockstep.
  #   - lint runs golangci-lint across three Go modules (root,
  #     internal/test/antithesis, examples/dingo-gov-lens) plus `make
  #     config-parity`; reuseable-golangci-lint.yml scans only the root module,
  #     so migrating would silently drop the other two modules and the parity
  #     gate.
  #   - antithesis.yml (scheduled Antithesis fault-injection runs),
  #     benchmark.yml (weekly benchstat suite) and config-parity.yml (scheduled
  #     upstream-config drift report) are repo-specific and have no shared
  #     equivalent.
  - name: blinklabs-io/dingo
    settings:
      delete_branch_on_merge: true
    collaborators: []
    branch_protection:
      - branch: main
        <<: *branch_protection_defaults
    workflows:
