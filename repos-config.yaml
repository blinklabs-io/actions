  # adder is a Go service with a desktop GUI tray (Fyne/CGO) and platform
  # installers (Windows MSI, macOS .pkg). Its release pipeline (macOS
  # signed+notarized .pkg, Windows signed .msi, Linux/FreeBSD tarballs, native
  # multi-arch Docker images, and per-artifact build-provenance attestations) is
  # driven by the shared reuseable-publish-desktop.yml workflow below. The
  # repo-specific packaging scripts (packaging/macos/build-pkg.sh,
  # packaging/windows/build-msi.ps1) and Makefile targets that workflow invokes
  # remain in-repo. test-msi.yml is a manual (workflow_dispatch) MSI smoke-test
  # harness with no shared equivalent, so it stays managed in-repo. The CI
  # checks below use the shared reusable workflows, passing adder's Fyne system
  # dependencies and CGO requirements.
  - name: blinklabs-io/adder
    settings:
      delete_branch_on_merge: true
    collaborators: []
    branch_protection:
      - branch: main
        <<: *branch_protection_defaults
    workflows:
      - destination_file: conventional-commits.yml
        workflow_name: "Conventional Commits"
        reusable_workflow: "blinklabs-io/actions/.github/workflows/reuseable-conventional-commits.yml@main"
        triggers:
          pull_request:

      - destination_file: go-test.yml
        pipeline: ci.yml
        pipeline_name: ci
        supersedes: [golangci-lint.yml, nilaway.yml]
        workflow_name: "go-test"
        reusable_workflow: "blinklabs-io/actions/.github/workflows/reuseable-go-test.yml@main"
        triggers:
          pull_request:
          push:
            branches: [main]
            tags: ['v*']
        params:
          go-versions: '["1.26.x"]'
          platforms: '["ubuntu-latest","windows-latest"]'
          system-dependencies: "libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev wayland-protocols"
          pre-test-command: "make build"
          test-flags: "-v -timeout 10m"
          windows-test-packages: "./tray/setup/..."
          test-env: "LANG=en_US.UTF-8"
          run-golangci-lint: "true"
          golangci-go-version: "1.26.x"
          golangci-platform: "ubuntu-latest"
          golangci-cgo-enabled: "true"
          run-nilaway: "true"
          nilaway-go-version: "1.26.x"
          nilaway-platform: "ubuntu-latest"
          nilaway-cgo-enabled: "true"
          nilaway-include-pkgs: "github.com/blinklabs-io/adder"
          nilaway-exclude-pkgs: "github.com/go-gl/glfw"

      - destination_file: ci-docker.yml
        workflow_name: "Docker CI"
        reusable_workflow: "blinklabs-io/actions/.github/workflows/reuseable-ci-docker-multiarch.yml@main"
        triggers:
          pull_request:
            branches: [main]
            paths:
              - Dockerfile
              - cmd/**
              - docs/**
              - internal/**
              - go.*
              - .github/workflows/ci-docker.yml
        params:
          image-name: "blinklabs-io/adder"

      - destination_file: publish.yml
        pipeline: ci.yml
        needs: [go-test]
        if: github.event_name == 'push'
        workflow_name: "publish"
        # Pinned to an immutable commit SHA (not @main): this call hands the
        # reusable Apple, Google Cloud KMS, and Docker credentials plus
        # release/package write access, so it must reference a reviewed, frozen
        # revision. Bump this SHA in a reviewed change when adopting new
        # desktop-publish behavior.
        #
        # IMPORTANT: this repo squash-merges PRs, so a PR-branch commit SHA is
        # NOT replayed onto main and is unreachable once the branch is deleted.
        # GitHub Actions cannot resolve a reusable workflow at an unreachable
        # SHA ("cannot find workflow"), which fails the caller before any job is
        # created. Always pin to a commit that lands on main (the squash/merge
        # commit), never to a feature-branch commit.
        reusable_workflow: "blinklabs-io/actions/.github/workflows/reuseable-publish-desktop.yml@394a5619291089536fd1a22361de7b8ea6703ac8"
        triggers:
          push:
            branches: [main]
            tags: ['v*.*.*']
        # Union of the capabilities the reusable's jobs actually need:
        # attestations + id-token (build provenance), contents (release
        # create/undraft and asset uploads), packages (image push), and
        # security-events (Trivy SARIF upload). Individual jobs narrow further.
        permissions:
          attestations: write
          contents: write
          id-token: write
          packages: write
          security-events: write
        secrets:
          # Docker Hub
          docker-password: DOCKER_PASSWORD
          # Apple Developer ID signing + notarization (macOS .pkg)
          apple-certificate: APPLE_CERTIFICATE
          apple-certificate-password: APPLE_CERTIFICATE_PASSWORD
          apple-installer-certificate: APPLE_INSTALLER_CERTIFICATE
          # adder reuses the application-cert password for the installer cert.
          apple-installer-certificate-password: APPLE_CERTIFICATE_PASSWORD
          apple-keychain-password: APPLE_KEYCHAIN_PASSWORD
          apple-id: APPLE_ID
          apple-app-specific-password: APPLE_APP_SPECIFIC_PASSWORD
          apple-team-id: APPLE_TEAM_ID
          # Windows EV code signing via jsign + Google Cloud KMS (MSI)
          certificate-sa-credentials: CERTIFICATE_SA_CREDENTIALS
          certificate-chain: CERTIFICATE_CHAIN
          certificate-store-type: CERTIFICATE_STORE_TYPE
          certificate-keystore: CERTIFICATE_KEYSTORE
          certificate-key-name: CERTIFICATE_KEY_NAME
        params:
          application-name: "adder"
          docker-image: "blinklabs/adder"
          description: "Adder is a tool for tailing the Cardano blockchain and emitting events"
          go-version: "1.26.x"
          # Preserve the capitalized Authenticode display name the in-repo
          # workflow used (application-name is lowercase "adder").
          windows-signing-name: "Adder"
  # adder-mobile is a Flutter mobile app (not a Go service). It uses the shared
  # conventional-commits check plus the shared reusable Flutter CI workflow for
  # PR analyze/test (pr.yml) and the main-branch release APK build (publish.yml).
  # The APK build writes android/app/google-services.json from the
