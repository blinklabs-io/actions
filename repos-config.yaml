        reusable_workflow: "blinklabs-io/shared-actions/.github/workflows/reuseable-release-dispatch.yml@d90d0eef9c2d00ecac430e1b184ac2993ac768fb"
        triggers:
          workflow_run:
            workflows: [ci]
            types: [completed]
        permissions:
          contents: read
        secrets:
          token: ORG_PROJECT_PAT
    release_fanout:
      - repo: blinklabs-io/ansible-cardano
        type: ansible-role
        role: tx_submit_api_mirror
        refs: [roles/tx_submit_api_mirror/README.md]
  - name: blinklabs-io/txtop
