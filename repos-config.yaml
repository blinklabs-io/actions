        triggers:
          pull_request:
            paths:
              - '**/*.go'
              - go.*
              - Makefile
              - Dockerfile
              - scripts/**
          push:
            branches: [main]
            tags: ['v*.*.*']
            paths:
              - '**/*.go'
              - go.*
              - Makefile
              - Dockerfile
              - scripts/**
        permissions:
          contents: read
        params:
          run-golangci-lint: "true"
          run-nilaway: "true"
          nilaway-version: "latest"
          test-flags: "-race"

