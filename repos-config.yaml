  # plutigo is a Go library (a Plutus interpreter). It uses git submodules for
  # test fixtures and uploads coverage to Codecov, so go-test enables both;
  # nilaway skips a stack-machine docstring. benchmark.yml is repository-specific
  # and remains hand-maintained.
  - name: blinklabs-io/plutigo
    settings:
      delete_branch_on_merge: true
    collaborators: []
    branch_protection:
      - branch: main
        <<: *branch_protection_defaults
    workflows:
      - destination_file: conventional-commits.yml
        workflow_name: "Conventional Commits"
        reusable_workflow: "blinklabs-io/actions/.github/workflows/reuseable-conventional-commits.yml@main"
        triggers:
          pull_request:

      - destination_file: go-test.yml
        pipeline: ci.yml
        pipeline_name: ci
        supersedes: [golangci-lint.yml, nilaway.yml]
        workflow_name: "go-test"
        reusable_workflow: "blinklabs-io/actions/.github/workflows/reuseable-go-test.yml@main"
        triggers:
          workflow_dispatch:
          pull_request:
          push:
            branches: [main]
            tags: ['v*']
        params:
          submodules: "true"
          pre-test-command: "make test"
          test-flags: "-race -coverprofile=coverage.out -covermode=atomic"
          upload-coverage: "true"
          run-golangci-lint: "true"
          run-nilaway: "true"
          nilaway-include-pkgs: "github.com/blinklabs-io/plutigo"
          nilaway-exclude-file-docstrings: "<nilaway skip stack-machine>"

      - destination_file: publish.yml
        pipeline: ci.yml
        needs: [go-test]
        if: github.event_name == 'push' && github.ref_type == 'tag'
        workflow_name: "publish"
        reusable_workflow: "blinklabs-io/actions/.github/workflows/reuseable-go-library-release.yml@main"
        triggers:
          push:
            tags: ['v*.*.*']
        # reuseable-go-library-release's publish-examples job statically
        # declares id-token/attestations write. GitHub validates a called
        # workflow's permission requirements at load time regardless of the
        # job's runtime if: gate, so the caller must grant the full set even
        # though plutigo leaves build-examples unset and never runs that job.
        permissions:
          contents: write
          id-token: write
          attestations: write
