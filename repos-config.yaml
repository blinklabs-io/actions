  # adder is a Go service with a desktop GUI tray (Fyne/CGO) and platform
  # installers (Windows MSI, macOS .pkg). Its release pipeline (macOS
  # signed+notarized .pkg, Windows signed .msi, Linux/FreeBSD tarballs, native
  # multi-arch Docker images, and per-artifact build-provenance attestations) is
  # driven by the shared reuseable-publish-desktop.yml workflow below. The
  # repo-specific packaging scripts (packaging/macos/build-pkg.sh,
  # packaging/windows/build-msi.ps1) and Makefile targets that workflow invokes
  # remain in-repo. test-msi.yml is a manual (workflow_dispatch) MSI smoke-test
  # harness with no shared equivalent, so it stays managed in-repo. The CI
  # checks below use the shared reusable workflows, passing adder's Fyne system
  # dependencies and CGO requirements.
  - name: blinklabs-io/adder
    settings:
      delete_branch_on_merge: true
    collaborators: []
    branch_protection:
      - branch: main
        <<: *branch_protection_defaults
    workflows:
      - destination_file: conventional-commits.yml
        workflow_name: "Conventional Commits"
        reusable_workflow: "blinklabs-io/actions/.github/workflows/reuseable-conventional-commits.yml@main"
        triggers:
          pull_request:

      - destination_file: go-test.yml
        workflow_name: "go-test"
        reusable_workflow: "blinklabs-io/actions/.github/workflows/reuseable-go-test.yml@main"
        triggers:
          pull_request:
          push:
            branches: [main]
            tags: ['v*']
        params:
          go-versions: '["1.26.x"]'
          platforms: '["ubuntu-latest","windows-latest"]'
          system-dependencies: "libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev wayland-protocols"
          pre-test-command: "make build"
          test-flags: "-v -timeout 10m"
          windows-test-packages: "./tray/setup/..."
          test-env: "LANG=en_US.UTF-8"

      - destination_file: golangci-lint.yml
        workflow_name: "golangci-lint"
        reusable_workflow: "blinklabs-io/actions/.github/workflows/reuseable-golangci-lint.yml@main"
        triggers:
          pull_request:
          push:
            branches: [main]
            tags: ['v*']
        params:
          go-version: "1.26.x"
          cgo-enabled: "true"
          system-dependencies: "libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev wayland-protocols"

      - destination_file: nilaway.yml
        workflow_name: "nilaway"
        reusable_workflow: "blinklabs-io/actions/.github/workflows/reuseable-nilaway.yml@main"
        triggers:
          pull_request:
          push:
            branches: [main]
            tags: ['v*']
        params:
          include-pkgs: "github.com/blinklabs-io/adder"
          exclude-pkgs: "github.com/go-gl/glfw"
          go-version: "1.26.x"
          cgo-enabled: "true"
          system-dependencies: "libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev wayland-protocols"

      - destination_file: ci-docker.yml
        workflow_name: "Docker CI"
        reusable_workflow: "blinklabs-io/actions/.github/workflows/reuseable-ci-docker-multiarch.yml@main"
        triggers:
          pull_request:
            branches: [main]
            paths:
              - Dockerfile
              - cmd/**
              - docs/**
              - internal/**
              - go.*
              - .github/workflows/ci-docker.yml
        params:
          image-name: "blinklabs-io/adder"

      - destination_file: publish.yml
        workflow_name: "publish"
        # Pinned to an immutable commit SHA (not @main): this call hands the
        # reusable Apple, Google Cloud KMS, and Docker credentials plus
        # release/package write access, so it must reference a reviewed, frozen
        # revision. Bump this SHA in a reviewed change when adopting new
        # desktop-publish behavior.
        reusable_workflow: "blinklabs-io/actions/.github/workflows/reuseable-publish-desktop.yml@3d3e357980cc51cafa37ec5f51354df6604231ed"
        triggers:
          push:
            branches: [main]
            tags: ['v*.*.*']
        # Union of the capabilities the reusable's jobs actually need:
        # attestations + id-token (build provenance), contents (release
        # create/undraft and asset uploads), packages (image push), and
        # security-events (Trivy SARIF upload). Individual jobs narrow further.
        permissions:
          attestations: write
          contents: write
          id-token: write
          packages: write
          security-events: write
        secrets:
          # Docker Hub
          docker-password: DOCKER_PASSWORD
          # Apple Developer ID signing + notarization (macOS .pkg)
          apple-certificate: APPLE_CERTIFICATE
          apple-certificate-password: APPLE_CERTIFICATE_PASSWORD
          apple-installer-certificate: APPLE_INSTALLER_CERTIFICATE
          # adder reuses the application-cert password for the installer cert.
          apple-installer-certificate-password: APPLE_CERTIFICATE_PASSWORD
          apple-keychain-password: APPLE_KEYCHAIN_PASSWORD
          apple-id: APPLE_ID
          apple-app-specific-password: APPLE_APP_SPECIFIC_PASSWORD
          apple-team-id: APPLE_TEAM_ID
          # Windows EV code signing via jsign + Google Cloud KMS (MSI)
          certificate-sa-credentials: CERTIFICATE_SA_CREDENTIALS
          certificate-chain: CERTIFICATE_CHAIN
          certificate-store-type: CERTIFICATE_STORE_TYPE
          certificate-keystore: CERTIFICATE_KEYSTORE
          certificate-key-name: CERTIFICATE_KEY_NAME
        params:
          application-name: "adder"
          docker-image: "blinklabs/adder"
          description: "Adder is a tool for tailing the Cardano blockchain and emitting events"
          go-version: "1.26.x"
          # Preserve the capitalized Authenticode display name the in-repo
          # workflow used (application-name is lowercase "adder").
          windows-signing-name: "Adder"
  # adder-mobile is a Flutter mobile app (not a Go service). It uses the shared
  # conventional-commits check plus the shared reusable Flutter CI workflow for
  # PR analyze/test (pr.yml) and the main-branch release APK build (publish.yml).
  # The APK build writes android/app/google-services.json from the
  # GOOGLE_SERVICES_JSON secret and uploads the versioned APK artifact. Store
  # signing / app-store release packaging is not handled by the shared workflow
  # and would remain repository-specific if added later.
  - name: blinklabs-io/adder-mobile
    settings:
      delete_branch_on_merge: true
    collaborators: []
    branch_protection:
      - branch: main
        <<: *branch_protection_defaults
    workflows:
      - destination_file: conventional-commits.yml
        workflow_name: "Conventional Commits"
        reusable_workflow: "blinklabs-io/actions/.github/workflows/reuseable-conventional-commits.yml@main"
        triggers:
          pull_request:

      - destination_file: pr.yml
        workflow_name: "PR"
        reusable_workflow: "blinklabs-io/actions/.github/workflows/reuseable-flutter.yml@main"
        triggers:
          pull_request:
        params:
          flutter-version: "3.22.0"
          channel: "stable"
          run-analyze: "true"
          run-tests: "true"
          build-apk: "false"

      - destination_file: publish.yml
        workflow_name: "Build Flutter APK"
        reusable_workflow: "blinklabs-io/actions/.github/workflows/reuseable-flutter.yml@main"
        triggers:
          push:
            branches: [main]
        secrets:
          GOOGLE_SERVICES_JSON: GOOGLE_SERVICES_JSON
        params:
          flutter-version: "3.22.0"
          channel: "stable"
          run-analyze: "false"
          run-tests: "false"
          build-apk: "true"
          create-google-services: "true"
          apk-artifact-name: "app-${{ github.ref_name }}-release.apk"

  # cardano-compose-stacks provides docker-compose stacks for Cardano services.
  # It runs a weekly (and manually triggerable) job that compares upstream
  # container image versions against the compose file and opens update PRs. This
  # is handled by the shared reusable check-versions workflow. The repository's
  # scripts/upstream-versions.json, scripts/add-version.sh and docker-compose.yaml
  # match the reusable workflow's defaults, so no params or secrets are needed
  # (the workflow falls back to the built-in github.token).
  - name: blinklabs-io/cardano-compose-stacks
    settings:
      delete_branch_on_merge: true
    collaborators: []
    branch_protection:
      - branch: main
        <<: *branch_protection_defaults
    workflows:
      - destination_file: check-versions.yml
        workflow_name: "check-versions"
        reusable_workflow: "blinklabs-io/actions/.github/workflows/reuseable-check-versions.yml@main"
        triggers:
          schedule:
          - cron: 0 0 * * 0
          workflow_dispatch:
        permissions:
          contents: write
          pull-requests: write

  # cardano-up is a Go command line utility for managing Cardano services for
  # local development. Its CI (conventional commits, go-test, golangci-lint,
  # nilaway, Docker CI) and release/publish pipeline are migrated to the shared
  # reusable workflows. The reusable defaults for the Go toolchain and lint
  # versions match the repository's originals, so only the image/binary naming,
  # Docker Hub description, docker-password secret and the linux/darwin-only
  # binary matrix need to be provided.
  - name: blinklabs-io/cardano-up
    settings:
      delete_branch_on_merge: true
    collaborators: []
    branch_protection:
      - branch: main
        <<: *branch_protection_defaults
    workflows:
      - destination_file: conventional-commits.yml
        workflow_name: "Conventional Commits"
        reusable_workflow: "blinklabs-io/actions/.github/workflows/reuseable-conventional-commits.yml@main"
        triggers:
          pull_request:

      - destination_file: go-test.yml
        workflow_name: "go-test"
        reusable_workflow: "blinklabs-io/actions/.github/workflows/reuseable-go-test.yml@main"
        triggers:
          pull_request:
          push:
            branches: [main]
            tags: ['v*']

      - destination_file: golangci-lint.yml
        workflow_name: "golangci-lint"
        reusable_workflow: "blinklabs-io/actions/.github/workflows/reuseable-golangci-lint.yml@main"
        triggers:
          pull_request:
          push:
            branches: [main]
            tags: ['v*']

      - destination_file: nilaway.yml
        workflow_name: "nilaway"
        reusable_workflow: "blinklabs-io/actions/.github/workflows/reuseable-nilaway.yml@main"
        triggers:
          pull_request:
          push:
            branches: [main]
            tags: ['v*']
        params:
          include-pkgs: "github.com/blinklabs-io/cardano-up"

      - destination_file: ci-docker.yml
        workflow_name: "Docker CI"
        reusable_workflow: "blinklabs-io/actions/.github/workflows/reuseable-ci-docker-multiarch.yml@main"
        triggers:
          pull_request:
            branches: [main]
            paths:
              - Dockerfile
              - Makefile
              - cmd/**
              - docs/**
              - internal/**
              - pkgmgr/**
              - go.*
              - .github/workflows/ci-docker.yml
        params:
          image-name: "blinklabs-io/cardano-up"

      - destination_file: publish.yml
        workflow_name: "publish"
        reusable_workflow: "blinklabs-io/actions/.github/workflows/reuseable-publish.yml@main"
        triggers:
          push:
            branches: [main]
            tags: ['v*.*.*']
        permissions:
          actions: write
          attestations: write
          checks: write
          contents: write
          id-token: write
          packages: write
          statuses: write
        secrets:
          docker-password: DOCKER_PASSWORD
        params:
          binary-name: "cardano-up"
          docker-image: "blinklabs/cardano-up"
          description: "Command line utility for managing Cardano services for local development"
          binary-os-matrix: '["linux","darwin"]'

  # cardano-up-packages hosts the package definitions installed by the
  # cardano-up CLI. Three governed workflows:
  #   - conventional-commits: lints PR titles/commits.
  #   - package-validate: downloads the cardano-up CLI and validates the package
  #     definitions on pushes to main, version tags and pull requests.
  #   - check-versions: weekly (and manually triggerable) job that checks each
  #     package's upstream release (GitHub release, GHCR or Docker Hub image)
  #     against the newest local packages/<pkg>/<pkg>-*.yaml file and opens
  #     update PRs. This uses the packages-specific reusable check-versions
  #     workflow (distinct from the docker-compose one used by
  #     cardano-compose-stacks). It needs an org PAT so the opened PRs trigger
  #     downstream CI, so the workflow's `token` secret is mapped to
  #     ORG_PROJECT_PAT.
  - name: blinklabs-io/cardano-up-packages
    settings:
      delete_branch_on_merge: true
    collaborators: []
    branch_protection:
      - branch: main
        <<: *branch_protection_defaults
    workflows:
      - destination_file: conventional-commits.yml
        workflow_name: "Conventional Commits"
        reusable_workflow: "blinklabs-io/actions/.github/workflows/reuseable-conventional-commits.yml@main"
        triggers:
          pull_request:

      - destination_file: package-validate.yml
        workflow_name: "package-validate"
        reusable_workflow: "blinklabs-io/actions/.github/workflows/reuseable-package-validate.yml@main"
        triggers:
          push:
            branches: [main]
            tags: ['v*']
          pull_request:

      - destination_file: check-versions.yml
        workflow_name: "check-versions"
        reusable_workflow: "blinklabs-io/actions/.github/workflows/reuseable-check-versions-packages.yml@main"
        triggers:
          schedule:
          - cron: 0 0 * * 0
          workflow_dispatch:
        permissions:
          contents: write
          pull-requests: write
        secrets:
          token: ORG_PROJECT_PAT
