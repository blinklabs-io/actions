# Shared branch-protection defaults — referenced via YAML merge key below.
branch_protection_defaults: &branch_protection_defaults
  required_status_checks: []
  require_up_to_date: false
  bypass_pull_request: false
  bypass_actors_users: []
  bypass_actors_teams: []
  bypass_actors_apps:
    - blinklabs-governance
  required_approving_review_count: 1
  dismiss_stale_reviews: true
  require_code_owner_reviews: false
  enforce_admins: false
  require_linear_history: false
  required_conversation_resolution: false
  allow_force_pushes: false
  allow_deletions: false
  lock_branch: false

# Optional org-wide auto-discovery. Disabled by default: when absent or
# `enabled: false`, the engine manages exactly the repositories listed under
# `repositories:` below. When enabled, the engine additionally lists the
# organization's repositories and manages any that carry a profile marker at
# `marker_path` (default `.blinklabs/profile.yml`). Explicit `repositories:`
# entries always take precedence over discovered ones.
#
# NOTE: enabling discovery requires the sync workflow to mint an org-scoped
# GitHub App token (see .github/workflows/sync.yaml); it also enables the
# scheduled reconciliation run so newly-created marker repos are picked up.
#
# discovery:
#   enabled: true
#   organization: blinklabs-io
#   topic: blinklabs-managed          # optional: only repos with this topic
#   marker_path: .blinklabs/profile.yml  # optional (this is the default)

profiles:
  # docker-standard: the shared shape for every simple Docker wrapper repo.
  # A repo using this profile only supplies `vars` (image + description) and,
  # for genuinely special cases, `overrides`.
  docker-standard:
    settings:
      delete_branch_on_merge: true
    collaborators: []
    branch_protection:
      - branch: main
        <<: *branch_protection_defaults
    workflows:
      - destination_file: conventional-commits.yml
        workflow_name: "Conventional Commits"
        reusable_workflow: "blinklabs-io/actions/.github/workflows/reuseable-conventional-commits.yml@main"
        triggers:
          pull_request:

      - destination_file: ci-docker.yml
        workflow_name: "Docker CI"
        reusable_workflow: "blinklabs-io/actions/.github/workflows/reuseable-ci-docker-multiarch.yml@main"
        triggers:
          pull_request:
            branches: [main]
            paths:
              - Dockerfile
              - .github/workflows/ci-docker.yml
        params:
          image-name: "blinklabs-io/${image}"

      - destination_file: publish.yml
        workflow_name: "publish"
        reusable_workflow: "blinklabs-io/actions/.github/workflows/reuseable-publish-docker-multiarch.yml@main"
        triggers:
          push:
            branches: [main]
            tags: ['v*.*.*']
        permissions:
          contents: write
          packages: write
          id-token: write
          attestations: write
          # The reusable's multi-arch-manifest job declares
          # security-events: write (for the Trivy SARIF upload, which is now
          # enabled by default). Reusable-workflow permissions cannot be
          # elevated by the caller, so every docker-standard publisher must
          # grant it here; it is also required when enable-trivy-scan is
          # overridden to false, otherwise the call fails validation with
          # "requesting 'security-events: write', but is only allowed
          # 'security-events: none'".
          security-events: write
        secrets:
          docker-password: DOCKER_PASSWORD
        params:
          docker-image: "blinklabs/${image}"
          ghcr-image: "blinklabs-io/${image}"
          description: "${description}"

  # repository-standard: baseline governance for repositories whose CI and
  # release workflows are still maintained locally. Release workflows are
  # added only after each repository's needs have been reviewed.
  repository-standard:
    settings:
      delete_branch_on_merge: true
    collaborators: []
    branch_protection:
      - branch: main
        <<: *branch_protection_defaults
    workflows:
      - destination_file: conventional-commits.yml
        workflow_name: "Conventional Commits"
        reusable_workflow: "blinklabs-io/actions/.github/workflows/reuseable-conventional-commits.yml@main"
        triggers:
          pull_request:

  go-ci-standard:
    settings:
      delete_branch_on_merge: true
    collaborators: []
    branch_protection:
      - branch: main
        <<: *branch_protection_defaults
    workflows:
      - destination_file: conventional-commits.yml
        workflow_name: "Conventional Commits"
        reusable_workflow: "blinklabs-io/actions/.github/workflows/reuseable-conventional-commits.yml@main"
        triggers:
          pull_request:

      - destination_file: go-test.yml
        supersedes: [golangci-lint.yml, nilaway.yml]
        workflow_name: "go-test"
        reusable_workflow: "blinklabs-io/actions/.github/workflows/reuseable-go-test.yml@main"
        triggers:
          pull_request:
          push:
            branches: [main]
            tags: ['v*']
        params:
          run-golangci-lint: "true"
          run-nilaway: "true"

  go-ci-race-nilaway:
    settings:
      delete_branch_on_merge: true
    collaborators: []
    branch_protection:
      - branch: main
        <<: *branch_protection_defaults
    workflows:
      - destination_file: conventional-commits.yml
        workflow_name: "Conventional Commits"
        reusable_workflow: "blinklabs-io/actions/.github/workflows/reuseable-conventional-commits.yml@main"
        triggers:
          pull_request:

      - destination_file: go-test.yml
        pipeline: ci.yml
        pipeline_name: CI
        job_id: go-test
        supersedes: [nilaway.yml, golangci-lint.yml]
        workflow_name: "go-test"
        reusable_workflow: "blinklabs-io/actions/.github/workflows/reuseable-go-test.yml@main"
        triggers:
          pull_request:
          push:
            branches: [main]
            tags: ['v*.*.*']
        params:
          test-flags: "-race"
          run-golangci-lint: "true"
          golangci-extra-args: "--build-tags e2e --tests ./test/e2e/..."
          run-nilaway: "true"
          nilaway-version: "latest"
          nilaway-include-pkgs: "github.com/blinklabs-io/dingo-operator"

      - destination_file: publish.yml
        pipeline: ci.yml
        pipeline_name: CI
        job_id: publish
        needs: [go-test]
        if: github.event_name == 'push'
        workflow_name: "publish"
        reusable_workflow: "blinklabs-io/actions/.github/workflows/reuseable-publish.yml@main"
        triggers:
          pull_request:
          push:
            branches: [main]
            tags: ['v*.*.*']
        permissions:
          actions: write
          attestations: write
          checks: write
          contents: write
          id-token: write
          packages: write
          statuses: write
        secrets:
          docker-password: DOCKER_PASSWORD
        params:
          binary-name: "dingo-operator"
          docker-image: "blinklabs/dingo-operator"
          description: "Kubernetes operator for Dingo Cardano nodes"
          update-go-proxy: "true"

  go-ci-verified:
    settings:
      delete_branch_on_merge: true
    collaborators: []
    branch_protection:
      - branch: main
        <<: *branch_protection_defaults
    workflows:
      - destination_file: conventional-commits.yml
        workflow_name: "Conventional Commits"
        reusable_workflow: "blinklabs-io/actions/.github/workflows/reuseable-conventional-commits.yml@main"
        triggers:
          pull_request:

      - destination_file: go-test.yml
        pipeline: ci.yml
        pipeline_name: CI
        job_id: go-test
        workflow_name: "go-test"
        reusable_workflow: "blinklabs-io/actions/.github/workflows/reuseable-go-test.yml@main"
        triggers:
          pull_request:
          push:
            branches: [main]
            tags: ['v*']
        params:
          go-versions: '["1.25.x","1.26.x"]'
          verify-modules: "true"
          run-build: "true"
          run-vet: "true"
          test-flags: "-v -race"
          run-golangci-lint: "true"
          golangci-go-version: "1.26.x"

      - destination_file: publish.yml
        pipeline: ci.yml
        pipeline_name: CI
        job_id: publish
        needs: [go-test]
        if: startsWith(github.ref, 'refs/tags/')
        workflow_name: publish
        reusable_workflow: "blinklabs-io/actions/.github/workflows/reuseable-publish.yml@main"
        triggers:
          pull_request:
          push:
            branches: [main]
            tags: ['v*']
        permissions:
          actions: write
          attestations: write
          checks: write
          contents: write
          id-token: write
          packages: write
          statuses: write
        params:
          binary-name: "buidlerfest"
          go-version: "1.26.x"
          publish-container-image: "false"
          binary-target-matrix: '[{"os":"linux","arch":"amd64"},{"os":"linux","arch":"arm64"},{"os":"darwin","arch":"amd64"},{"os":"darwin","arch":"arm64"},{"os":"windows","arch":"amd64"}]'
          create-checksums: "true"
          prerelease: ${{ contains(github.ref, '-') }}
          binary-build-command: |-
            OUTPUT_NAME=buidlerfest
            if [ "$MATRIX_OS" = "windows" ]; then
              OUTPUT_NAME="$OUTPUT_NAME.exe"
            fi
            GOOS="$MATRIX_OS" GOARCH="$MATRIX_ARCH" go build -ldflags "-s -w -X main.Version=$RELEASE_TAG -X main.Commit=$COMMIT_HASH -X main.BuildDate=$BUILD_DATE" -o "$OUTPUT_NAME" ./cmd/buidlerfest

