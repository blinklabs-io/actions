      - destination_file: publish.yml
        pipeline: ci.yml
        pipeline_name: CI
        job_id: publish
        needs: [go-test]
        if: github.event_name == 'push'
        workflow_name: "publish"
        reusable_workflow: "blinklabs-io/shared-actions/.github/workflows/reuseable-publish.yml@d90d0eef9c2d00ecac430e1b184ac2993ac768fb"
        triggers:
