        triggers:
          pull_request:
            branches: [main]
          push:
            branches: [main]
        params:
          go-versions: '["1.26.x","1.27.x"]'
          platforms: '["ubuntu-26.04","windows-latest"]'
          check-mod-tidy: "true"
          verify-modules: "true"
          run-vet: "true"
          run-golangci-lint: "true"
          golangci-platform: "ubuntu-26.04"
          golangci-go-version: "1.26.x"
          check-format: "true"
          run-build: "true"
          build-packages: "./cmd/dns-cli"
          run-race-test: "true"
          forbidden-go-imports: 'github.com/Salvionied/apollo([^/]|$)'
      - destination_file: conventional-commits.yml
        workflow_name: "Conventional Commits"
        reusable_workflow: "blinklabs-io/shared-actions/.github/workflows/reuseable-conventional-commits.yml@d90d0eef9c2d00ecac430e1b184ac2993ac768fb"
        triggers:
          pull_request:
        permissions:
          contents: read

