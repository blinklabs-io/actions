  # dingoctl: build.yml (multi-OS artifact build, no Dockerfile) and
  # publish.yml (GoReleaser + cosign + Homebrew tap) doesn't map to a shared
  # reusable workflow and stays hand-maintained. Go tests and golangci-lint now
  # run sequentially in one shared job. security.yml's govulncheck and gosec jobs are
  # superseded by the shared govulncheck.yml below (security.yml should be
  # removed from the repo to avoid a duplicate run). There was no existing
  # conventional-commits check, so it's added as a net-new check.
  - name: blinklabs-io/dingoctl
    settings:
      delete_branch_on_merge: true
    collaborators: []
    branch_protection:
      - branch: main
        <<: *branch_protection_defaults
    workflows:
      - destination_file: conventional-commits.yml
        workflow_name: "Conventional Commits"
        reusable_workflow: "blinklabs-io/actions/.github/workflows/reuseable-conventional-commits.yml@main"
        triggers:
          pull_request:

      - destination_file: go-test.yml
        supersedes: [golangci-lint.yml]
        workflow_name: "go-test"
        reusable_workflow: "blinklabs-io/actions/.github/workflows/reuseable-go-test.yml@main"
        triggers:
          pull_request:
          push:
            branches: [main]
            tags: ['v*']
        params:
          go-versions: '["1.25.x"]'
          platforms: '["ubuntu-latest","macos-latest","windows-latest"]'
          pre-test-command: "make build"
          test-flags: "-v -race -timeout 10m"
          run-golangci-lint: "true"
          golangci-go-version: "1.25.x"
          golangci-platform: "ubuntu-latest"

      - destination_file: govulncheck.yml
        workflow_name: "govulncheck"
        reusable_workflow: "blinklabs-io/actions/.github/workflows/reuseable-govulncheck.yml@main"
        triggers:
          pull_request:
          push:
            branches: [main]
            tags: ['v*']
          schedule:
            - cron: '0 0 * * 1'
        permissions:
          security-events: write
        params:
          run-gosec: "true"
  # dns-cli release.yml remains repository-specific because its binary build
  # embeds contract and release metadata. CI is expressed through the reusable
  # Go test workflow; Apollo is pinned in go.mod, so the old sibling checkout
  # was unused.
  - name: blinklabs-io/dns-cli
    settings:
      delete_branch_on_merge: true
    collaborators: []
    branch_protection:
      - branch: main
        <<: *branch_protection_defaults
    workflows:
