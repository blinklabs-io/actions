        params:
          binary-name: "scls"
          binary-target-matrix: '[{"os":"darwin","arch":"arm64"},{"os":"freebsd","arch":"amd64"},{"os":"freebsd","arch":"arm64"},{"os":"linux","arch":"amd64"},{"os":"linux","arch":"arm64"},{"os":"windows","arch":"amd64"},{"os":"windows","arch":"arm64"}]'
          docker-image: "blinklabs/scls"
          description: "scls - CLI for the Cardano SCLS ledger-state container format"
          go-version: "1.26.x"
          update-go-proxy: "true"
  - name: blinklabs-io/bluefin
    <<: *repository-standard
    workflows:
      - *conventional-commits

      - <<: *go-test-standard
        params:
          <<: *go-test-standard-params
          nilaway-go-version: "1.26.x"
          nilaway-include-pkgs: "github.com/blinklabs-io/bluefin"
      - <<: *docker-ci
        triggers:
          pull_request:
            branches: [main]
        params:
          image-name: "blinklabs-io/bluefin"
  # bluefin: publish.yml does inline Windows (jsign + Google Cloud KMS) and
  # macOS (codesign + notarytool + .app bundling) signing that doesn't match
  # reuseable-publish-desktop.yml's tray/installer packaging scripts, so it
  # stays hand-maintained. ci-docker.yml has no such dependency (the
  # signing/notarization only happens in publish.yml), so it migrates to the
  # shared reusable; this also fixes a latent gap where the hand-maintained
  # version never actually built the arm64 platform (the `platforms:` line
  # was commented out with a `TODO: test multiple platforms` note).
  - name: blinklabs-io/nview
    <<: *repository-standard
    workflows:
      - *conventional-commits

      - <<: *go-test-standard
        pipeline: ci.yml
        pipeline_name: CI
        job_id: go-test
        params:
          <<: *go-test-standard-params
          go-versions: '["1.26.x","1.27.x"]'
          golangci-go-version: "1.26.x"
          check-format: "true"
          nilaway-go-version: "1.26.x"
          nilaway-include-pkgs: "github.com/blinklabs-io/nview"

      - <<: *docker-ci
        triggers:
          pull_request:
            branches: [main]
            paths:
              - Dockerfile
              - '*.go'
              - go.*
              - .github/workflows/ci-docker.yml
        params:
          image-name: "blinklabs-io/nview"

      - <<: *go-service-publish
        pipeline_name: ci
        job_id: publish
        triggers:
          push:
            branches: [main]
            tags: ['v*.*.*']
        permissions: *go-service-publish-permissions
        secrets:
          docker-password: DOCKER_PASSWORD
          maxmind-api-credentials: MAXMIND_API_CREDENTIALS
        params:
          binary-name: "nview"
          docker-image: "blinklabs/nview"
          description: "nview is a local monitoring tool for a Cardano node"
          go-version: "1.26.x"
          pre-build-command: "resources/update.sh"
          pre-build-on-tags-only: "true"
          build-args: |-
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || '' }}
            COMMIT_HASH=${{ github.sha }}
  - name: blinklabs-io/vpn-indexer
