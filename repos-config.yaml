# Private GitHub Free controllers trust repository writers; paid environment
# approval and state rulesets are not enforced. Private target protection is skipped.
github_free: true

# Shared branch-protection defaults — referenced via YAML merge key below.
branch_protection_defaults: &branch_protection_defaults
  required_status_checks: []
  require_up_to_date: false
  bypass_pull_request: false
  bypass_actors_users: []
  bypass_actors_teams: []
  bypass_actors_apps:
    - blinklabs-governance
  required_approving_review_count: 1
  dismiss_stale_reviews: true
  require_code_owner_reviews: false
  enforce_admins: false
  require_linear_history: false
  required_conversation_resolution: false
  allow_force_pushes: false
  allow_deletions: false
  lock_branch: false

# Actions commit for automatically injected release-fanout.yml wrappers;
# it must contain reuseable-release-dispatch.yml. Empty skips injection.
# Explicit workflow and profile entries use their own reusable_workflow
# references and remain enabled when this ref is empty.
release_fanout_dispatch_ref: e0caeb743570431ebc4e26aeea54cdf8ab6a0a33

# Upstream releases that update Blink Labs roles without managing upstream repos.
external_release_fanout:
  - repo: txpipe/dolos
    targets:
      - repo: blinklabs-io/ansible-cardano
        type: ansible-role
        role: dolos
        refs: [roles/dolos/README.md]
  - repo: CardanoSolutions/kupo
    targets:
      - repo: blinklabs-io/ansible-cardano
        type: ansible-role
        role: kupo
        refs: [roles/kupo/README.md]
  - repo: CardanoSolutions/ogmios
    targets:
      - repo: blinklabs-io/ansible-cardano
        type: ansible-role
        role: ogmios
        refs: [roles/ogmios/README.md]

# Optional org-wide auto-discovery. Disabled by default: when absent or
# `enabled: false`, the engine manages exactly the repositories listed under
# `repositories:` below. When enabled, the engine additionally lists the
# organization's repositories and manages any that carry a profile marker at
# `marker_path` (default `.blinklabs/profile.yml`). Explicit `repositories:`
# entries always take precedence over discovered ones.
#
# NOTE: enabling discovery requires the sync workflow to mint an org-scoped
# GitHub App token (see .github/workflows/sync.yaml); it also enables the
# scheduled reconciliation run so newly-created marker repos are picked up.
#
# discovery:
#   enabled: true
#   organization: blinklabs-io
#   topic: blinklabs-managed          # optional: only repos with this topic
#   marker_path: .blinklabs/profile.yml  # optional (this is the default)

profiles:
  # docker-standard: the shared shape for every simple Docker wrapper repo.
  # A repo using this profile only supplies `vars` (image + description) and,
  # for genuinely special cases, `overrides`.
  docker-standard: &docker-standard
    settings:
      delete_branch_on_merge: true
    collaborators: []
    dependabot: |
      version: 2
      updates:
        - package-ecosystem: docker
          directory: /
          schedule:
            interval: weekly
        - package-ecosystem: github-actions
          directory: /
          schedule:
            interval: weekly
    branch_protection:
      - branch: main
        <<: *branch_protection_defaults
    workflows:
      - &conventional-commits
        destination_file: conventional-commits.yml
        workflow_name: "Conventional Commits"
        reusable_workflow: "blinklabs-io/shared-actions/.github/workflows/reuseable-conventional-commits.yml@d90d0eef9c2d00ecac430e1b184ac2993ac768fb"
        triggers:
          pull_request:
        permissions:
          contents: read

      - &docker-ci
        destination_file: ci-docker.yml
        workflow_name: "Docker CI"
        reusable_workflow: "blinklabs-io/shared-actions/.github/workflows/reuseable-ci-docker-multiarch.yml@d90d0eef9c2d00ecac430e1b184ac2993ac768fb"
        triggers:
          pull_request:
            branches: [main]
            paths:
              - Dockerfile
              - .github/workflows/ci-docker.yml
        params:
          image-name: "blinklabs-io/${image}"

      - &docker-publish
        destination_file: publish.yml
        workflow_name: "publish"
        reusable_workflow: "blinklabs-io/shared-actions/.github/workflows/reuseable-publish-docker-multiarch.yml@d90d0eef9c2d00ecac430e1b184ac2993ac768fb"
        triggers:
          push:
            branches: [main]
            tags: ['v*.*.*']
        permissions:
          contents: write
          packages: write
          id-token: write
          attestations: write
          # The reusable's scan-images job declares
          # security-events: write (for the Trivy SARIF upload, which is now
          # enabled by default). Reusable-workflow permissions cannot be
          # elevated by the caller, so every docker-standard publisher must
          # grant it here; it is also required when enable-trivy-scan is
          # overridden to false, otherwise the call fails validation with
          # "requesting 'security-events: write', but is only allowed
          # 'security-events: none'".
          security-events: write
        secrets:
          docker-password: DOCKER_PASSWORD
        params:
          docker-image: "blinklabs/${image}"
          ghcr-image: "blinklabs-io/${image}"
          description: "${description}"

  docker-actions-only: &docker-actions-only
    <<: *docker-standard
    dependabot: |
      version: 2
      updates:
        - package-ecosystem: github-actions
          directory: /
          schedule:
            interval: weekly

  docker-deps-prefix:
    <<: *docker-standard
    dependabot: |
      version: 2
      updates:
        - package-ecosystem: docker
          directory: /
          schedule:
            interval: weekly
          commit-message:
            prefix: "chore(deps):"
        - package-ecosystem: github-actions
          directory: /
          schedule:
            interval: weekly
          commit-message:
            prefix: "chore(deps):"

  docker-standard-fanout:
    <<: *docker-standard
    workflows: &docker-fanout-workflows
      - *conventional-commits
      - *docker-ci
      - *docker-publish
      - destination_file: release-fanout.yml
        workflow_name: "release-fanout"
        reusable_workflow: "blinklabs-io/shared-actions/.github/workflows/reuseable-release-dispatch.yml@d90d0eef9c2d00ecac430e1b184ac2993ac768fb"
        triggers:
          workflow_run:
            workflows: [publish]
            types: [completed]
        permissions:
          contents: read
        secrets:
          token: ORG_PROJECT_PAT

  docker-actions-only-fanout:
    <<: *docker-actions-only
    workflows: *docker-fanout-workflows

  # repository-standard: baseline governance for repositories whose CI and
  # release workflows are still maintained locally. Release workflows are
  # added only after each repository's needs have been reviewed.
  repository-standard: &repository-standard
    settings:
      delete_branch_on_merge: true
    collaborators: []
    branch_protection:
      - branch: main
        <<: *branch_protection_defaults
    workflows:
      - destination_file: conventional-commits.yml
        workflow_name: "Conventional Commits"
        reusable_workflow: "blinklabs-io/shared-actions/.github/workflows/reuseable-conventional-commits.yml@d90d0eef9c2d00ecac430e1b184ac2993ac768fb"
        triggers:
          pull_request:
        permissions:
          contents: read

  # Protected callers can advance their reviewed revision separately from the standard caller.
  repository-standard-pinned:
    <<: *repository-standard
    workflows:
      - <<: *conventional-commits
        reusable_workflow: "blinklabs-io/shared-actions/.github/workflows/reuseable-conventional-commits.yml@d90d0eef9c2d00ecac430e1b184ac2993ac768fb"
        pin_to_latest_change: false

  helm-charts-standard:
    <<: *repository-standard
    workflows:
      - <<: *conventional-commits
        reusable_workflow: "blinklabs-io/shared-actions/.github/workflows/reuseable-conventional-commits.yml@d90d0eef9c2d00ecac430e1b184ac2993ac768fb"
      - destination_file: publish-helm-charts.yml
        workflow_name: "Publish Helm Charts"
        reusable_workflow: "blinklabs-io/shared-actions/.github/workflows/reuseable-helm-publish.yml@d90d0eef9c2d00ecac430e1b184ac2993ac768fb"
        pin_to_latest_change: false
        supersedes:
          - publish-adder-helm-chart.yml
          - publish-balius-helm-chart.yml
          - publish-balius-operator-helm-chart.yml
          - publish-bind9-helm-chart.yml
          - publish-bluefin-helm-chart.yml
          - publish-bursa-helm-chart.yml
          - publish-butane-oracle-helm-chart.yml
          - publish-cardano-db-sync-helm-chart.yml
          - publish-cardano-node-helm-chart.yml
          - publish-cardano-node-leios-helm-chart.yml
          - publish-cdnsd-helm-chart.yml
          - publish-demeter-fabric-helm-chart.yml
          - publish-dingo-helm-chart.yml
          - publish-dingo-operator-helm-chart.yml
          - publish-dolos-helm-chart.yml
          - publish-ergo-node-helm-chart.yml
          - publish-ext-blockfrost-operator-helm-chart.yml
          - publish-ext-cardano-node-operator-helm-chart.yml
          - publish-ext-kupo-operator-helm-chart.yml
          - publish-ext-ogmios-operator-helm-chart.yml
          - publish-ext-proxy-helm-chart.yml
          - publish-ext-tx-submit-api-operator-helm-chart.yml
          - publish-ext-utxorpc-operator-helm-chart.yml
          - publish-handshake-node-helm-chart.yml
          - publish-hsd-helm-chart.yml
          - publish-hydrozoa-helm-chart.yml
          - publish-kupo-helm-chart.yml
          - publish-ogmios-helm-chart.yml
          - publish-openvpn-helm-chart.yml
          - publish-postgres-cluster-helm-chart.yml
          - publish-rbac-helm-chart.yml
          - publish-storageclasses-helm-chart.yml
          - publish-svc-dns-stack-helm-chart.yml
          - publish-tx-submit-api-helm-chart.yml
          - publish-tx-submit-api-mirror-helm-chart.yml
          - publish-vpn-indexer-helm-chart.yml
          - publish-wireguard-helm-chart.yml
        triggers:
          push:
            branches: [main]
        permissions:
          contents: read
          packages: write

  go-ci-standard:
    settings:
      delete_branch_on_merge: true
    collaborators: []
    branch_protection:
      - branch: main
        <<: *branch_protection_defaults
    workflows:
      - *conventional-commits

      - &go-test-standard
        destination_file: go-test.yml
        supersedes: [golangci-lint.yml, nilaway.yml]
        workflow_name: "go-test"
        reusable_workflow: &go-test-caller "blinklabs-io/shared-actions/.github/workflows/reuseable-go-test.yml@d90d0eef9c2d00ecac430e1b184ac2993ac768fb"
        triggers: &go-ci-check-triggers
          pull_request:
          push:
            branches: [main]
            tags: ['v*']
        params: &go-test-standard-params
          run-golangci-lint: "true"
          run-nilaway: "true"

  go-ci-race-nilaway:
    <<: *repository-standard
    workflows:
      - *conventional-commits

      - <<: *go-test-standard
        pipeline: ci.yml
        pipeline_name: CI
        job_id: go-test
        supersedes: [nilaway.yml, golangci-lint.yml]
        triggers: &dingo-operator-ci-triggers
          pull_request:
          push:
            branches: [main]
            tags: ['v*.*.*']
        params:
          <<: *go-test-standard-params
          test-flags: "-race"
          golangci-extra-args: "--build-tags e2e --tests ./test/e2e/..."
          nilaway-version: "latest"
          nilaway-include-pkgs: "github.com/blinklabs-io/dingo-operator"

      - <<: &go-service-publish
          destination_file: publish.yml
          pipeline: ci.yml
          needs: [go-test]
          if: github.event_name == 'push'
          workflow_name: "publish"
          reusable_workflow: "blinklabs-io/shared-actions/.github/workflows/reuseable-publish.yml@d90d0eef9c2d00ecac430e1b184ac2993ac768fb"
        pipeline_name: CI
        job_id: publish
        triggers: *dingo-operator-ci-triggers
        permissions: &go-service-publish-permissions
          actions: write
          attestations: write
          checks: write
          contents: write
          id-token: write
          packages: write
          statuses: write
        secrets:
          docker-password: DOCKER_PASSWORD
        params:
          binary-name: "dingo-operator"
          docker-image: "blinklabs/dingo-operator"
          description: "Kubernetes operator for Dingo Cardano nodes"
          update-go-proxy: "true"

  go-ci-verified:
    settings:
      delete_branch_on_merge: true
    collaborators: []
    branch_protection:
      - branch: main
        <<: *branch_protection_defaults
    workflows:
      - destination_file: conventional-commits.yml
        workflow_name: "Conventional Commits"
        reusable_workflow: "blinklabs-io/shared-actions/.github/workflows/reuseable-conventional-commits.yml@d90d0eef9c2d00ecac430e1b184ac2993ac768fb"
        triggers:
          pull_request:
        permissions:
          contents: read

      - destination_file: go-test.yml
        pipeline: ci.yml
        pipeline_name: CI
        job_id: go-test
        workflow_name: "go-test"
        reusable_workflow: "blinklabs-io/shared-actions/.github/workflows/reuseable-go-test.yml@d90d0eef9c2d00ecac430e1b184ac2993ac768fb"
        triggers:
          pull_request:
          push:
            branches: [main]
            tags: ['v*']
        params:
          go-versions: '["1.26.x","1.27.x"]'
          verify-modules: "true"
          run-build: "true"
          run-vet: "true"
          test-flags: "-v -race"
          run-golangci-lint: "true"
          golangci-go-version: "1.26.x"

      - destination_file: publish.yml
        pipeline: ci.yml
        pipeline_name: CI
        job_id: publish
        needs: [go-test]
        if: startsWith(github.ref, 'refs/tags/')
        workflow_name: publish
        reusable_workflow: "blinklabs-io/shared-actions/.github/workflows/reuseable-publish.yml@d90d0eef9c2d00ecac430e1b184ac2993ac768fb"
        triggers:
          pull_request:
          push:
            branches: [main]
            tags: ['v*']
        permissions:
          actions: write
          attestations: write
          checks: write
          contents: write
          id-token: write
          packages: write
          statuses: write
        params:
          binary-name: "buidlerfest"
          go-version: "1.26.x"
          publish-container-image: "false"
          binary-target-matrix: '[{"os":"linux","arch":"amd64"},{"os":"linux","arch":"arm64"},{"os":"darwin","arch":"amd64"},{"os":"darwin","arch":"arm64"},{"os":"windows","arch":"amd64"}]'
          create-checksums: "true"
          prerelease: ${{ contains(github.ref, '-') }}
          binary-build-command: |-
            OUTPUT_NAME=buidlerfest
            if [ "$MATRIX_OS" = "windows" ]; then
              OUTPUT_NAME="$OUTPUT_NAME.exe"
            fi
            GOOS="$MATRIX_OS" GOARCH="$MATRIX_ARCH" go build -ldflags "-s -w -X main.Version=$RELEASE_TAG -X main.Commit=$COMMIT_HASH -X main.BuildDate=$BUILD_DATE" -o "$OUTPUT_NAME" ./cmd/buidlerfest

repositories:
  - name: blinklabs-io/shared-actions
    private: false
    settings:
      description: Shared GitHub Actions and reusable workflows for Blink Labs
      homepage: ""
      default_branch: main
      has_issues: true
      has_projects: true
      has_wiki: true
      allow_auto_merge: false
      allow_update_branch: false
      web_commit_signoff_required: true
      squash_merge_commit_title: COMMIT_OR_PR_TITLE
      squash_merge_commit_message: COMMIT_MESSAGES
      merge_commit_title: MERGE_MESSAGE
      merge_commit_message: PR_TITLE
      delete_branch_on_merge: true
      allow_merge_commit: false
      allow_squash_merge: true
      allow_rebase_merge: false
    teams:
      - slug: core
        permission: push
      - slug: ops
        permission: admin
      - slug: pms
        permission: maintain
      - slug: docs
        permission: push
    branch_protection:
      - branch: main
        <<: *branch_protection_defaults

  - name: blinklabs-io/tx-submit-api
    settings:
      delete_branch_on_merge: true
    collaborators: []
    branch_protection:
      - branch: main
        # required_status_checks will be updated after the first PR run
        # confirms the generated workflow check names (orchestrate / <job>).
        <<: *branch_protection_defaults
    workflows:
      - destination_file: conventional-commits.yml
        workflow_name: "Conventional Commits"
        reusable_workflow: "blinklabs-io/shared-actions/.github/workflows/reuseable-conventional-commits.yml@d90d0eef9c2d00ecac430e1b184ac2993ac768fb"
        triggers:
          pull_request:
        permissions:
          contents: read

      - destination_file: go-test.yml
        pipeline: ci.yml
        pipeline_name: ci
        supersedes: [golangci-lint.yml, nilaway.yml]
        workflow_name: "go-test"
        reusable_workflow: "blinklabs-io/shared-actions/.github/workflows/reuseable-go-test.yml@d90d0eef9c2d00ecac430e1b184ac2993ac768fb"
        triggers:
          pull_request:
          push:
            branches: [main]
            tags: ['v*']
        params:
          run-golangci-lint: "true"
          run-nilaway: "true"
          nilaway-include-pkgs: "github.com/blinklabs-io/tx-submit-api"

      - destination_file: ci-docker.yml
        workflow_name: "Docker CI"
        reusable_workflow: "blinklabs-io/shared-actions/.github/workflows/reuseable-ci-docker-multiarch.yml@d90d0eef9c2d00ecac430e1b184ac2993ac768fb"
        triggers:
          pull_request:
            branches: [main]
            paths:
              - Dockerfile
              - cmd/**
              - docs/**
              - internal/**
              - go.*
              - .github/workflows/ci-docker.yml
        params:
          image-name: "blinklabs-io/tx-submit-api"

      - destination_file: publish.yml
        pipeline: ci.yml
        needs: [go-test]
        if: github.event_name == 'push'
        workflow_name: "publish"
        reusable_workflow: "blinklabs-io/shared-actions/.github/workflows/reuseable-publish.yml@d90d0eef9c2d00ecac430e1b184ac2993ac768fb"
        triggers:
          push:
            branches: [main]
            tags: ['v*.*.*']
        permissions:
          actions: write
          attestations: write
          checks: write
          contents: write
          id-token: write
          packages: write
          statuses: write
        secrets:
          docker-password: DOCKER_PASSWORD
        params:
          binary-name: "tx-submit-api"
          docker-image: "blinklabs/tx-submit-api"
          description: "A Go implementation of the Cardano Submit API service"
          update-go-proxy: "true"
      - destination_file: release-fanout.yml
        workflow_name: "release-fanout"
        reusable_workflow: "blinklabs-io/shared-actions/.github/workflows/reuseable-release-dispatch.yml@d90d0eef9c2d00ecac430e1b184ac2993ac768fb"
        triggers:
          workflow_run:
            workflows: [ci]
            types: [completed]
        permissions:
          contents: read
        secrets:
          token: ORG_PROJECT_PAT
    release_fanout:
      - repo: blinklabs-io/ansible-cardano
        type: ansible-role
        role: tx_submit_api
        refs: [roles/tx_submit_api/README.md]
      - repo: blinklabs-io/cardano-up-packages
        type: cardano-up-package
        package: tx-submit-api
      - repo: blinklabs-io/cardano-compose-stacks
        type: compose-default
        file: docker-compose.yaml
        var: TX_SUBMIT_API_VERSION
  - name: blinklabs-io/tx-submit-api-mirror
    <<: *repository-standard
    workflows:
      - *conventional-commits

      - <<: *go-test-standard
        pipeline: ci.yml
        pipeline_name: ci
        job_id: go-test
        params:
