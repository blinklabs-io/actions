name: Reusable Publish

on:
  workflow_call:
    inputs:
      binary-name:
        description: Name of the compiled binary (e.g. tx-submit-api).
        required: true
        type: string
      additional-binary-names:
        description: JSON array of additional compiled binaries uploaded with the primary binary.
        required: false
        type: string
        default: '[]'
      attestation-subject-path:
        description: Optional file path or glob matching all release binaries to attest.
        required: false
        type: string
        default: ""
      docker-image:
        description: Docker Hub image name (e.g. blinklabs/tx-submit-api). Leave empty to skip Docker Hub and publish to GHCR only.
        required: false
        type: string
        default: ""
      description:
        description: Short description for the Docker Hub repository.
        required: false
        type: string
        default: ""
      publish-container-image:
        description: Build and publish the GHCR image and, when configured, the Docker Hub image.
        required: false
        type: boolean
        default: true
      go-version:
        description: Go toolchain version to use for building binaries.
        required: false
        type: string
        default: "1.26.x"
      binary-target-matrix:
        description: JSON array of OS/architecture objects for binary builds.
        required: false
        type: string
        default: '[{"os":"linux","arch":"amd64"},{"os":"linux","arch":"arm64"},{"os":"darwin","arch":"amd64"},{"os":"darwin","arch":"arm64"},{"os":"freebsd","arch":"amd64"},{"os":"freebsd","arch":"arm64"},{"os":"windows","arch":"amd64"},{"os":"windows","arch":"arm64"}]'
      binary-compress:
        description: When true, the release binary is packed into a .tar.gz archive before uploading.
        required: false
        type: boolean
        default: false
      build-args:
        description: Build ARG values to pass to Docker build (multi-line KEY=VALUE pairs).
        required: false
        type: string
        default: ""
      binary-build-command:
        description: Optional shell command that builds the primary binary. Empty runs `make build`.
        required: false
        type: string
        default: ""
      create-checksums:
        description: Upload a SHA-256 checksum manifest covering every release binary.
        required: false
        type: boolean
        default: false
      prerelease:
        description: Mark the created release as a prerelease.
        required: false
        type: boolean
        default: false
      update-go-proxy:
        description: Trigger a module refresh on proxy.golang.org after release creation.
        required: false
        type: boolean
        default: false
      pre-build-command:
        description: Optional shell command run after checkout and before binary and Docker builds.
        required: false
        type: string
        default: ""
      pre-build-on-tags-only:
        description: Run pre-build-command only for tag pushes.
        required: false
        type: boolean
        default: false
    secrets:
      docker-password:
        description: Docker Hub access token. Required when docker-image is set.
        required: false
      maxmind-api-credentials:
        description: MaxMind API credentials passed to pre-build-command as MAXMIND_API_CREDENTIALS.
        required: false

concurrency: ${{ github.ref }}

jobs:
  create-draft-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      RELEASE_ID: ${{ steps.create-release.outputs.result }}
    steps:
      - run: |
          echo "RELEASE_TAG=${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9 https://github.com/actions/github-script/releases/tag/v9
        id: create-release
        if: startsWith(github.ref, 'refs/tags/')
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          result-encoding: string
          script: |
            try {
              const response = await github.rest.repos.createRelease({
                draft: true,
                generate_release_notes: true,
                name: process.env.RELEASE_TAG,
                owner: context.repo.owner,
                prerelease: ${{ inputs.prerelease }},
                repo: context.repo.repo,
                tag_name: process.env.RELEASE_TAG,
              });
              return response.data.id;
            } catch (error) {
              core.setFailed(error.message);
            }

  build-binaries:
    strategy:
      matrix:
        include: ${{ fromJson(inputs.binary-target-matrix) }}
    runs-on: ubuntu-latest
    needs: [create-draft-release]
    permissions:
      actions: write
      attestations: write
      checks: write
      contents: write
      id-token: write
      packages: write
      statuses: write
    steps:
      - run: |
          echo "RELEASE_TAG=${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          fetch-depth: '0'
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6 https://github.com/actions/setup-go/releases/tag/v6
        with:
          go-version: ${{ inputs.go-version }}
      - name: Build metadata
        id: build-metadata
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Prepare build inputs
        if: inputs.pre-build-command != '' && (!inputs.pre-build-on-tags-only || startsWith(github.ref, 'refs/tags/'))
        shell: bash
        env:
          PRE_BUILD_COMMAND: ${{ inputs.pre-build-command }}
          MAXMIND_API_CREDENTIALS: ${{ secrets.maxmind-api-credentials }}
        run: bash -c "$PRE_BUILD_COMMAND"
      - name: Build binary
        if: inputs.binary-build-command == ''
        env:
          MATRIX_OS: ${{ matrix.os }}
          MATRIX_ARCH: ${{ matrix.arch }}
        run: GOOS="$MATRIX_OS" GOARCH="$MATRIX_ARCH" make build
      - name: Build custom binary
        if: inputs.binary-build-command != ''
        shell: bash
        env:
          BINARY_BUILD_COMMAND: ${{ inputs.binary-build-command }}
          MATRIX_OS: ${{ matrix.os }}
          MATRIX_ARCH: ${{ matrix.arch }}
          RELEASE_TAG: ${{ github.ref_name }}
          COMMIT_HASH: ${{ github.sha }}
          BUILD_DATE: ${{ steps.build-metadata.outputs.date }}
        run: bash -c "$BINARY_BUILD_COMMAND"
      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/')
        env:
          BINARY_NAME: ${{ inputs.binary-name }}
          ADDITIONAL_BINARY_NAMES: ${{ inputs.additional-binary-names }}
          MATRIX_OS: ${{ matrix.os }}
          MATRIX_ARCH: ${{ matrix.arch }}
          BINARY_COMPRESS: ${{ inputs.binary-compress }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.create-draft-release.outputs.RELEASE_ID }}
        run: |
          _binary_names=("$BINARY_NAME")
          while IFS= read -r _binary_name; do
            [ -n "$_binary_name" ] && _binary_names+=("$_binary_name")
          done < <(jq -r '.[]' <<< "$ADDITIONAL_BINARY_NAMES")
          for _binary_name in "${_binary_names[@]}"; do
            _binary_src="$_binary_name"
            _base="${_binary_name}-${RELEASE_TAG}-${MATRIX_OS}-${MATRIX_ARCH}"
            if [[ "$MATRIX_OS" == "windows" ]]; then
              _binary_src="${_binary_src}.exe"
              _base="${_base}.exe"
            fi
            if [[ "$BINARY_COMPRESS" == "true" ]]; then
              _filename="${_base}.tar.gz"
              tar czf "${_filename}" "${_binary_src}"
            else
              _filename="${_base}"
              cp "${_binary_src}" "${_filename}"
            fi
            echo "RELEASE_ASSET_FILENAME=${_filename}" >> "$GITHUB_ENV"
            curl --fail \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"${_filename}" \
              "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=${_filename}"
          done
      - name: Upload binaries for checksum manifest
        if: inputs.create-checksums && startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 https://github.com/actions/upload-artifact/releases/tag/v7.0.1
        with:
          name: binaries-${{ matrix.os }}-${{ matrix.arch }}
          path: '*-${{ github.ref_name }}-${{ matrix.os }}-${{ matrix.arch }}*'
          if-no-files-found: error
      - name: Attest binary
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2 https://github.com/actions/attest/releases/tag/v4.2.2
        with:
          subject-path: "${{ inputs.attestation-subject-path || env.RELEASE_ASSET_FILENAME || format('{0}{1}', inputs.binary-name, matrix.os == 'windows' && '.exe' || '') }}"

  checksum-assets:
    runs-on: ubuntu-latest
    needs: [create-draft-release, build-binaries]
    permissions:
      contents: write
    steps:
      - name: Download binaries
        if: inputs.create-checksums && startsWith(github.ref, 'refs/tags/')
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1 https://github.com/actions/download-artifact/releases/tag/v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Create checksum manifest
        if: inputs.create-checksums && startsWith(github.ref, 'refs/tags/')
        working-directory: dist
        run: sha256sum -- * > checksums.txt
      - name: Upload checksum manifest
        if: inputs.create-checksums && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.create-draft-release.outputs.RELEASE_ID }}
        run: |
          curl --fail \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @dist/checksums.txt \
            "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=checksums.txt"

  # Native multi-arch image builds: separate amd64 / arm64 jobs on native
  # runners (no QEMU emulation), followed by a manifest-merge job. Each arch job
  # pushes an arch-suffixed image and attests it; the manifest job stitches them
  # into the final multi-arch tags. Docker Hub steps are skipped when docker-image
  # is empty (GHCR-only repositories).
  build-image-amd64:
    if: inputs.publish-container-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          fetch-depth: '0'
          persist-credentials: false
      - name: Prepare build inputs
        if: inputs.pre-build-command != '' && (!inputs.pre-build-on-tags-only || startsWith(github.ref, 'refs/tags/'))
        shell: bash
        env:
          PRE_BUILD_COMMAND: ${{ inputs.pre-build-command }}
          MAXMIND_API_CREDENTIALS: ${{ secrets.maxmind-api-credentials }}
        run: bash -c "$PRE_BUILD_COMMAND"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1 https://github.com/docker/setup-buildx-action/releases/tag/v4.4.1
      - name: Login to Docker Hub
        if: inputs.docker-image != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0 https://github.com/docker/login-action/releases/tag/v4.6.0
        with:
          username: blinklabs
          password: ${{ secrets.docker-password }}
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0 https://github.com/docker/login-action/releases/tag/v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 https://github.com/actions/cache/releases/tag/v6.1.0
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-${{ runner.arch }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-buildx-
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0 https://github.com/docker/metadata-action/releases/tag/v6.2.0
        with:
          images: |
            ${{ inputs.docker-image }}
            ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
            suffix=-amd64
          tags: |
            # Only version, no revision
            type=match,pattern=v(.*)-(.*),group=1
            # branch
            type=ref,event=branch
            # semver
            type=semver,pattern={{version}}
      - name: push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0 https://github.com/docker/build-push-action/releases/tag/v7.4.0
        with:
          context: .
          push: true
          build-args: ${{ inputs.build-args }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max
      - name: cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache
      - name: Attest Docker Hub image (amd64)
        if: inputs.docker-image != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2 https://github.com/actions/attest-build-provenance/releases/tag/v4.2.2
        with:
          subject-name: index.docker.io/${{ inputs.docker-image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Attest GHCR image (amd64)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2 https://github.com/actions/attest-build-provenance/releases/tag/v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  build-image-arm64:
    if: inputs.publish-container-image
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          fetch-depth: '0'
          persist-credentials: false
      - name: Prepare build inputs
        if: inputs.pre-build-command != '' && (!inputs.pre-build-on-tags-only || startsWith(github.ref, 'refs/tags/'))
        shell: bash
        env:
          PRE_BUILD_COMMAND: ${{ inputs.pre-build-command }}
          MAXMIND_API_CREDENTIALS: ${{ secrets.maxmind-api-credentials }}
        run: bash -c "$PRE_BUILD_COMMAND"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1 https://github.com/docker/setup-buildx-action/releases/tag/v4.4.1
      - name: Login to Docker Hub
        if: inputs.docker-image != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0 https://github.com/docker/login-action/releases/tag/v4.6.0
        with:
          username: blinklabs
          password: ${{ secrets.docker-password }}
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0 https://github.com/docker/login-action/releases/tag/v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 https://github.com/actions/cache/releases/tag/v6.1.0
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-${{ runner.arch }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-buildx-
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0 https://github.com/docker/metadata-action/releases/tag/v6.2.0
        with:
          images: |
            ${{ inputs.docker-image }}
            ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
            suffix=-arm64v8
          tags: |
            # Only version, no revision
            type=match,pattern=v(.*)-(.*),group=1
            # branch
            type=ref,event=branch
            # semver
            type=semver,pattern={{version}}
      - name: push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0 https://github.com/docker/build-push-action/releases/tag/v7.4.0
        with:
          context: .
          push: true
          build-args: ${{ inputs.build-args }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max
      - name: cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache
      - name: Attest Docker Hub image (arm64)
        if: inputs.docker-image != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2 https://github.com/actions/attest-build-provenance/releases/tag/v4.2.2
        with:
          subject-name: index.docker.io/${{ inputs.docker-image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Attest GHCR image (arm64)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2 https://github.com/actions/attest-build-provenance/releases/tag/v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  image-manifest:
    if: inputs.publish-container-image
    runs-on: ubuntu-latest
    needs: [build-image-amd64, build-image-arm64]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          fetch-depth: '0'
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1 https://github.com/docker/setup-buildx-action/releases/tag/v4.4.1
      - name: Login to Docker Hub
        if: inputs.docker-image != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0 https://github.com/docker/login-action/releases/tag/v4.6.0
        with:
          username: blinklabs
          password: ${{ secrets.docker-password }}
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0 https://github.com/docker/login-action/releases/tag/v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR: all base tags (branch + version), no :latest.
      - id: meta-ghcr
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0 https://github.com/docker/metadata-action/releases/tag/v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=match,pattern=v(.*)-(.*),group=1
            type=ref,event=branch
            type=semver,pattern={{version}}
      # GHCR: version tags only, used to also point :latest on tag builds.
      - id: meta-ghcr-tag
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0 https://github.com/docker/metadata-action/releases/tag/v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=match,pattern=v(.*)-(.*),group=1
            type=semver,pattern={{version}}

      # Docker Hub metadata (only evaluated when docker-image is set).
      - id: meta-dockerhub
        if: inputs.docker-image != ''
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0 https://github.com/docker/metadata-action/releases/tag/v6.2.0
        with:
          images: ${{ inputs.docker-image }}
          flavor: |
            latest=false
          tags: |
            type=match,pattern=v(.*)-(.*),group=1
            type=ref,event=branch
            type=semver,pattern={{version}}
      - id: meta-dockerhub-tag
        if: inputs.docker-image != ''
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0 https://github.com/docker/metadata-action/releases/tag/v6.2.0
        with:
          images: ${{ inputs.docker-image }}
          flavor: |
            latest=false
          tags: |
            type=match,pattern=v(.*)-(.*),group=1
            type=semver,pattern={{version}}

      # Create and push manifests to GHCR. `docker buildx imagetools create`
      # creates and pushes atomically, avoiding stale-manifest issues.
      - name: manifest-ghcr
        env:
          GHCR_TAGS: ${{ steps.meta-ghcr.outputs.tags }}
        run: |
          for t in $GHCR_TAGS; do
            docker buildx imagetools create -t "${t}" "${t}-amd64" "${t}-arm64v8"
          done
      # On tag builds the version-tag manifest is already created by
      # manifest-ghcr above; here we only point :latest at the same images.
      - name: manifest-ghcr-latest
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GHCR_IMAGE: ghcr.io/${{ github.repository }}
          GHCR_TAG_TAGS: ${{ steps.meta-ghcr-tag.outputs.tags }}
        run: |
          for t in $GHCR_TAG_TAGS; do
            docker buildx imagetools create \
              -t "${GHCR_IMAGE}:latest" \
              "${t}-amd64" "${t}-arm64v8"
          done

      # Create and push manifests to Docker Hub (skipped when docker-image empty).
      - name: manifest-dockerhub
        if: inputs.docker-image != ''
        env:
          DH_TAGS: ${{ steps.meta-dockerhub.outputs.tags }}
        run: |
          for t in $DH_TAGS; do
            docker buildx imagetools create -t "${t}" "${t}-amd64" "${t}-arm64v8"
          done
      # On tag builds the version-tag manifest is already created by
      # manifest-dockerhub above; here we only point :latest at the same images.
      - name: manifest-dockerhub-latest
        if: inputs.docker-image != '' && startsWith(github.ref, 'refs/tags/')
        env:
          DOCKER_IMAGE: ${{ inputs.docker-image }}
          DH_TAG_TAGS: ${{ steps.meta-dockerhub-tag.outputs.tags }}
        run: |
          for t in $DH_TAG_TAGS; do
            docker buildx imagetools create \
              -t "${DOCKER_IMAGE}:latest" \
              "${t}-amd64" "${t}-arm64v8"
          done

      - name: Update Docker Hub description
        if: inputs.docker-image != '' && inputs.description != ''
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5 https://github.com/peter-evans/dockerhub-description/releases/tag/v5
        with:
          username: blinklabs
          password: ${{ secrets.docker-password }}
          repository: ${{ inputs.docker-image }}
          readme-filepath: ./README.md
          short-description: ${{ inputs.description }}

  finalize-release:
    if: always() && needs.create-draft-release.result == 'success' && needs.build-binaries.result == 'success' && needs.checksum-assets.result == 'success' && (needs.image-manifest.result == 'success' || needs.image-manifest.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [create-draft-release, build-binaries, image-manifest, checksum-assets]
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9 https://github.com/actions/github-script/releases/tag/v9
        if: startsWith(github.ref, 'refs/tags/')
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: ${{ needs.create-draft-release.outputs.RELEASE_ID }},
                draft: false,
              });
            } catch (error) {
              core.setFailed(error.message);
            }
      - name: Pull new module version
        if: inputs.update-go-proxy && startsWith(github.ref, 'refs/tags/')
        uses: andrewslotin/go-proxy-pull-action@00af8a5a49c844d6dde0bbbc116b72d8fd7ae97c # v1.5.0 https://github.com/andrewslotin/go-proxy-pull-action/releases/tag/v1.5.0
