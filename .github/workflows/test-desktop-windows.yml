name: Test Windows desktop compiler

on:
  push:
    paths:
      - '.github/workflows/reuseable-publish-desktop.yml'
      - '.github/workflows/test-desktop-windows.yml'
      - 'app/desktop_cgo_windows_test.go'
  pull_request:
    paths:
      - '.github/workflows/reuseable-publish-desktop.yml'
      - '.github/workflows/test-desktop-windows.yml'
      - 'app/desktop_cgo_windows_test.go'

permissions:
  contents: read

concurrency:
  group: desktop-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cgo:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - runner: windows-2025
            system: MINGW64
            package: mingw-w64-x86_64-gcc
          - runner: windows-11-arm
            system: CLANGARM64
            package: mingw-w64-clang-aarch64-clang
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          check-latest: true
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        id: msys2
        with:
          msystem: ${{ matrix.system }}
          update: true
          install: ${{ matrix.package }}
      - name: Build C/C++ fixture with the publishing step
        env:
          MSYS2_AMD64_LOC: ${{ steps.msys2.outputs.msys2-location }}
          MSYS2_ARM64_LOC: ${{ steps.msys2.outputs.msys2-location }}
        run: go test -tags desktopintegration ./app -run '^TestDesktopWindowsCGO$' -count=1 -v -timeout=10m
