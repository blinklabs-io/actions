name: Reusable govulncheck

on:
  workflow_call:
    inputs:
      go-version:
        description: Go toolchain version to use.
        required: false
        type: string
        default: "1.26.x"
      setup-go-cache:
        description: Enable module/build cache in actions/setup-go.
        required: false
        type: boolean
        default: true
      govulncheck-version:
        description: Version of govulncheck to install.
        required: false
        type: string
        default: "v1.7.0"
      run-gosec:
        description: "Also run gosec and upload its SARIF results to code scanning. Requires the caller to grant `security-events: write`."
        required: false
        type: boolean
        default: false
      submodules:
        description: Check out git submodules (passed to actions/checkout submodules).
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          submodules: ${{ inputs.submodules }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 https://github.com/actions/setup-go/releases/tag/v7.0.0
        with:
          go-version: ${{ inputs.go-version }}
          cache: ${{ inputs.setup-go-cache }}
      - name: govulncheck
        env:
          GOVULNCHECK_VERSION: ${{ inputs.govulncheck-version }}
        run: go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./...

  gosec:
    name: gosec
    if: inputs.run-gosec
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          submodules: ${{ inputs.submodules }}
          persist-credentials: false
      - name: Run gosec
        uses: securego/gosec@deb54465fea23d19a77f037e11e6589021f8501d # v2.29.0 https://github.com/securego/gosec/releases/tag/v2.29.0
        with:
          args: '-no-fail -fmt sarif -out results.sarif ./...'
      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2 https://github.com/github/codeql-action/releases/tag/v4.38.2
        with:
          sarif_file: results.sarif
