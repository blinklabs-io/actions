name: Reusable nilaway

on:
  workflow_call:
    inputs:
      include-pkgs:
        description: Package prefix passed to -include-pkgs (e.g. github.com/blinklabs-io/tx-submit-api). Leave empty to run nilaway against all packages.
        required: false
        type: string
        default: ""
      exclude-pkgs:
        description: Comma-separated package prefixes passed to -exclude-pkgs (e.g. github.com/go-gl/glfw). Empty skips the flag.
        required: false
        type: string
        default: ""
      go-version:
        description: Go toolchain version to use.
        required: false
        type: string
        default: "1.25.x"
      setup-go-cache:
        description: Enable module/build cache in actions/setup-go.
        required: false
        type: boolean
        default: true
      nilaway-version:
        description: Version or commit to install for NilAway.
        required: false
        type: string
        default: "ad240b12fb4c370017eb413f0388c71f3be8722c"
      install-with-local-toolchain:
        description: Prefix NilAway install with GOTOOLCHAIN=local.
        required: false
        type: boolean
        default: false
      system-dependencies:
        description: Space-separated apt packages to install before running NilAway (Linux). Empty skips installation.
        required: false
        type: string
        default: ""
      cgo-enabled:
        description: Set CGO_ENABLED=1 for the NilAway run (needed for cgo packages). Leaves the Go default when false.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  nilaway:
    name: nilaway
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 https://github.com/actions/setup-go/releases/tag/v7.0.0
        with:
          go-version: ${{ inputs.go-version }}
          cache: ${{ inputs.setup-go-cache }}
      - name: Install system dependencies
        if: inputs.system-dependencies != ''
        env:
          SYSTEM_DEPENDENCIES: ${{ inputs.system-dependencies }}
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086
          sudo apt-get install -y $SYSTEM_DEPENDENCIES
      - name: Enable CGO
        if: inputs.cgo-enabled
        run: echo "CGO_ENABLED=1" >> "$GITHUB_ENV"
      - name: install nilaway
        env:
          INSTALL_WITH_LOCAL_TOOLCHAIN: ${{ inputs.install-with-local-toolchain }}
          NILAWAY_VERSION: ${{ inputs.nilaway-version }}
        run: |
          if [ "$INSTALL_WITH_LOCAL_TOOLCHAIN" = "true" ]; then
            GOTOOLCHAIN=local go install "go.uber.org/nilaway/cmd/nilaway@${NILAWAY_VERSION}"
          else
            go install "go.uber.org/nilaway/cmd/nilaway@${NILAWAY_VERSION}"
          fi
      - name: run nilaway
        env:
          INCLUDE_PKGS: ${{ inputs.include-pkgs }}
          EXCLUDE_PKGS: ${{ inputs.exclude-pkgs }}
        run: |
          _args=()
          if [ -n "$EXCLUDE_PKGS" ]; then
            _args+=(-exclude-pkgs "$EXCLUDE_PKGS")
          fi
          if [ -n "$INCLUDE_PKGS" ]; then
            _args+=(-include-pkgs "$INCLUDE_PKGS")
          fi
          nilaway "${_args[@]}" ./...
