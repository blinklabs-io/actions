name: Central Governance Sync Engine

permissions:
  actions: read
  contents: read

on:
  push:
    branches: [main]
    paths:
      - 'repos-config.yaml'
      - '.github/workflows/reuseable-helm-publish.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

concurrency:
  group: governance-sync
  cancel-in-progress: false

jobs:
  orchestrate-governance:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout controller code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go runtime
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.26.x'
          check-latest: true

      # Private GitHub Free repositories cannot enforce environment reviewers.
      - name: Verify governance run context
        env:
          GH_TOKEN: ${{ github.token }}
        run: go run ./app verify-governance-context

      # Names for newly created and removed repositories cannot be scoped in
      # advance. The App installation must cover all organization repositories.
      - name: Authenticate via GitHub App
        id: generate-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.GOVERNANCE_APP_CLIENT_ID }}
          private-key: ${{ secrets.GOVERNANCE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-administration: write
          permission-members: read
          permission-contents: write
          permission-workflows: write

      - name: Verify governance app identity
        env:
          APP_SLUG: ${{ steps.generate-token.outputs.app-slug }}
        run: test "$APP_SLUG" = blinklabs-governance

      - name: Authenticate for Dingo workflow pull requests
        id: dingo-token
        continue-on-error: true
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.GOVERNANCE_APP_CLIENT_ID }}
          private-key: ${{ secrets.GOVERNANCE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: dingo
          permission-contents: write
          permission-workflows: write
          permission-pull-requests: write

      - name: Run governance sync
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          DINGO_WORKFLOW_PR_TOKEN: ${{ steps.dingo-token.outputs.token }}
          GOVERNANCE_LIFECYCLE_STATE_KEY: ${{ secrets.GOVERNANCE_APP_PRIVATE_KEY }}
        run: go run ./app
