name: Central Governance Sync Engine

permissions:
  actions: read
  contents: read

on:
  push:
    branches: [main]
    paths:
      - 'repos-config.yaml'
      - '.github/workflows/reuseable-helm-publish.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

concurrency:
  group: governance-sync
  cancel-in-progress: false

jobs:
  orchestrate-governance:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    environment: governance-sync
    steps:
      - name: Checkout controller code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go runtime
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          check-latest: true

      - name: Verify governance approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: go run ./app verify-governance-approval

      # Names for newly created and removed repositories cannot be scoped in
      # advance. The App installation must cover all organization repositories.
      - name: Authenticate via GitHub App
        id: generate-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.GOVERNANCE_APP_CLIENT_ID }}
          private-key: ${{ secrets.GOVERNANCE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-administration: write
          permission-contents: write
          permission-workflows: write

      - name: Verify governance app identity
        env:
          APP_SLUG: ${{ steps.generate-token.outputs.app-slug }}
        run: test "$APP_SLUG" = blinklabs-governance

      - name: Run governance sync
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          GOVERNANCE_LIFECYCLE_STATE_KEY: ${{ secrets.GOVERNANCE_LIFECYCLE_STATE_KEY }}
        run: go run ./app
