name: Reusable golangci-lint

on:
  workflow_call:
    inputs:
      go-version:
        description: Go toolchain version to use.
        required: false
        type: string
        default: "1.25.x"
      setup-go-cache:
        description: Enable module/build cache in actions/setup-go.
        required: false
        type: boolean
        default: true
      system-dependencies:
        description: Space-separated apt packages to install before linting (Linux). Empty skips installation.
        required: false
        type: string
        default: ""
      cgo-enabled:
        description: Set CGO_ENABLED=1 for the lint run (needed for cgo packages). Leaves the Go default when false.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3 https://github.com/actions/checkout/releases/tag/v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0 https://github.com/actions/setup-go/releases/tag/v6.0.0
        with:
          go-version: ${{ inputs.go-version }}
          cache: ${{ inputs.setup-go-cache }}
      - name: Install system dependencies
        if: inputs.system-dependencies != ''
        env:
          SYSTEM_DEPENDENCIES: ${{ inputs.system-dependencies }}
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086
          sudo apt-get install -y $SYSTEM_DEPENDENCIES
      - name: Enable CGO
        if: inputs.cgo-enabled
        run: echo "CGO_ENABLED=1" >> "$GITHUB_ENV"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9.2.1 https://github.com/golangci/golangci-lint-action/releases/tag/v9.2.1
