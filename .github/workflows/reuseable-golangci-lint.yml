name: Reusable golangci-lint

on:
  workflow_call:
    inputs:
      go-version:
        description: Go toolchain version to use.
        required: false
        type: string
        default: "1.26.x"
      version:
        description: golangci-lint version installed by the action.
        required: false
        type: string
        default: "latest"
      extra-args:
        description: Optional second golangci-lint invocation arguments.
        required: false
        type: string
        default: ""
      setup-go-cache:
        description: Enable module/build cache in actions/setup-go.
        required: false
        type: boolean
        default: true
      system-dependencies:
        description: Space-separated apt packages to install before linting (Linux). Empty skips installation.
        required: false
        type: string
        default: ""
      cgo-enabled:
        description: Set CGO_ENABLED=1 for the lint run (needed for cgo packages). Leaves the Go default when false.
        required: false
        type: boolean
        default: false
      submodules:
        description: Check out git submodules (passed to actions/checkout submodules).
        required: false
        type: boolean
        default: false
      check-format:
        description: Fail when `golangci-lint fmt --diff` reports unformatted files.
        required: false
        type: boolean
        default: false
      additional-working-directories:
        description: Newline-separated nested Go module directories to lint after the primary module, relative to the repository root.
        required: false
        type: string
        default: ""
      pre-lint-command:
        description: Optional bash command run before golangci-lint, from the repository root (e.g. "make config-parity"). Empty skips it.
        required: false
        type: string
        default: ""
      timeout-minutes:
        description: Job backstop against a wedged runner.
        required: false
        type: number
        default: 360
      working-directory:
        description: Go module directory relative to the repository root.
        required: false
        type: string
        default: "."

permissions:
  contents: read

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          submodules: ${{ inputs.submodules }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 https://github.com/actions/setup-go/releases/tag/v7.0.0
        with:
          go-version: ${{ inputs.go-version }}
          cache: ${{ inputs.setup-go-cache }}
          cache-dependency-path: |
            ${{ inputs.working-directory }}/go.mod
            ${{ inputs.working-directory }}/go.sum
      - name: Install system dependencies
        if: inputs.system-dependencies != ''
        env:
          SYSTEM_DEPENDENCIES: ${{ inputs.system-dependencies }}
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086
          sudo apt-get install -y $SYSTEM_DEPENDENCIES
      - name: Enable CGO
        if: inputs.cgo-enabled
        run: echo "CGO_ENABLED=1" >> "$GITHUB_ENV"
      - name: Pre-lint command
        if: inputs.pre-lint-command != ''
        shell: bash
        env:
          PRE_LINT_COMMAND: ${{ inputs.pre-lint-command }}
        run: |
          bash -c "$PRE_LINT_COMMAND"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0 https://github.com/golangci/golangci-lint-action/releases/tag/v9.3.0
        with:
          version: ${{ inputs.version }}
          working-directory: ${{ inputs.working-directory }}
      - name: golangci-lint (additional checks)
        if: inputs.extra-args != ''
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0 https://github.com/golangci/golangci-lint-action/releases/tag/v9.3.0
        with:
          version: ${{ inputs.version }}
          working-directory: ${{ inputs.working-directory }}
          args: ${{ inputs.extra-args }}
      - name: golangci-lint (additional modules)
        if: inputs.additional-working-directories != ''
        shell: bash
        env:
          MODULE_DIRECTORIES: ${{ inputs.additional-working-directories }}
          GOLANGCI_LINT_VERSION: ${{ inputs.version }}
        run: |
          # The action runs the binary it installs by path and does not put it
          # on PATH, so install the same version for the nested modules.
          if ! command -v golangci-lint >/dev/null 2>&1; then
            go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION:-latest}"
            PATH="$(go env GOPATH)/bin:$PATH"
          fi
          while IFS= read -r _directory; do
            [ -z "$_directory" ] && continue
            (cd "$_directory" && golangci-lint run)
          done <<< "$MODULE_DIRECTORIES"
      - name: Check formatting
        if: inputs.check-format
        working-directory: ${{ inputs.working-directory }}
        run: |
          if _diff="$(golangci-lint fmt --diff 2>&1)"; then
            _format_status=0
          else
            _format_status=$?
          fi
          if [ "$_format_status" -ne 0 ] || [ -n "$_diff" ]; then
            echo "Code is not formatted"
            printf '%s\n' "$_diff"
            exit 1
          fi
