name: Reusable Release Dispatch

# Announces a published, non-prerelease release to the central release-fanout
# workflow. Called from the generated release-fanout.yml wrapper, which runs
# when the product repository's publish workflow completes. A release created
# with GITHUB_TOKEN fires no `release` event, so the tag comes from the
# workflow run (a `release` event is still honoured).
#
# The token only needs Contents read/write on blinklabs-io/actions: that is
# what `repository_dispatch` requires. It never writes to target repositories.

on:
  workflow_call:
    secrets:
      token:
        description: Token allowed to create a repository_dispatch event on blinklabs-io/actions.
        required: true

permissions:
  contents: read

jobs:
  dispatch:
    if: >-
      ${{ github.event_name == 'release' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push') }}
    runs-on: ubuntu-latest
    steps:
      - name: Send repository_dispatch
        env:
          DISPATCH_TOKEN: ${{ secrets.token }}
          PRODUCT_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || github.event.workflow_run.head_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Branch pushes run the publish workflow too; only a tag with a
          # published, non-prerelease release is announced.
          # Only a missing release is a no-op; a rate limit or server error
          # fails the job so it can be re-run.
          if ! gh api "repos/${PRODUCT_REPO}/releases/tags/${RELEASE_TAG}" > release.json 2> gh.err; then
            if grep -q 'HTTP 404' gh.err; then
              echo "No release for ${RELEASE_TAG}; nothing to announce"
              exit 0
            fi
            cat gh.err >&2
            exit 1
          fi
          rc=0
          jq -e '.draft == false and .prerelease == false' release.json > /dev/null || rc=$?
          if [[ "$rc" -eq 1 ]]; then
            echo "${RELEASE_TAG} is a draft or prerelease; nothing to announce"
            exit 0
          elif [[ "$rc" -ne 0 ]]; then
            echo "::error::could not read release ${RELEASE_TAG} (jq status $rc)" >&2
            exit "$rc"
          fi
          payload=$(jq -n --arg repo "$PRODUCT_REPO" --arg version "$RELEASE_TAG" \
            '{event_type: "release-fanout", client_payload: {repo: $repo, version: $version}}')
          curl -sSf -X POST \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/blinklabs-io/actions/dispatches \
            -d "$payload"
          echo "Dispatched release-fanout for $PRODUCT_REPO $RELEASE_TAG"
