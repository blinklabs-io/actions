name: Reusable Publish Desktop

# Multi-platform publish pipeline for desktop-style Go applications that ship a
# GUI tray binary alongside the core CLI. It produces, per release tag:
#   - macOS signed + notarized + stapled .pkg installers (arm64 + amd64),
#   - Windows signed .msi installers (amd64 + arm64) via jsign + WiX,
#   - Linux / FreeBSD tarballs (with Fyne tray where supported),
#   - native multi-arch Docker images (Docker Hub + GHCR) with a merged manifest,
#   - build-provenance attestations for every binary, installer, and image.
#
# The heavy lifting (packaging, signing, notarization) lives in the CALLER's
# repository as scripts and Makefile targets that this workflow invokes:
#   - `make build` / `make build-tray`
#   - packaging/macos/build-pkg.sh
#   - packaging/windows/build-msi.ps1
# so this reusable stays generic while each app owns its packaging specifics.

on:
  workflow_call:
    inputs:
      application-name:
        description: Base name of the application binary (e.g. adder). The tray binary is "<application-name>-tray".
        required: true
        type: string
      go-version:
        description: Go toolchain version to build with.
        required: false
        type: string
        default: "1.26.x"
      docker-image:
        description: Docker Hub image name (e.g. blinklabs/adder). Leave empty to skip Docker Hub and publish to GHCR only.
        required: false
        type: string
        default: ""
      dockerhub-username:
        description: Docker Hub username used for login and the description update.
        required: false
        type: string
        default: blinklabs
      description:
        description: Short description for the Docker Hub repository. Empty skips the description update.
        required: false
        type: string
        default: ""
      tray-icon:
        description: Repo-relative path to the tray icon used by fyne-cross (FreeBSD tray builds).
        required: false
        type: string
        default: .github/assets/adder-logo-with-buffer.png
      fyne-cross-version:
        description: fyne-cross version to install for FreeBSD tray cross-compilation.
        required: false
        type: string
        default: v1.6.2
      windows-signing-name:
        description: Display name embedded in the Windows Authenticode signature. Empty falls back to application-name.
        required: false
        type: string
        default: ""
      project-url:
        description: Project URL embedded in the Windows signature. Empty falls back to the caller repository URL.
        required: false
        type: string
        default: ""
      apple-signing-org:
        description: Organization name in the Apple Developer ID identities (e.g. "Blink Labs Software").
        required: false
        type: string
        default: Blink Labs Software
      windows-tsa-url:
        description: RFC 3161 timestamp authority URL for jsign.
        required: false
        type: string
        default: http://timestamp.globalsign.com/tsa/r6advanced1
      enable-trivy-scan:
        description: Scan the published multi-arch image for HIGH/CRITICAL vulnerabilities with Trivy and upload SARIF. On by default.
        required: false
        type: boolean
        default: true
    secrets:
      docker-password:
        description: Docker Hub access token. Required when docker-image is set.
        required: false
      apple-certificate:
        description: Base64 Developer ID Application certificate (.p12). Required for signed macOS builds.
        required: false
      apple-certificate-password:
        description: Password for the Developer ID Application certificate.
        required: false
      apple-installer-certificate:
        description: Base64 Developer ID Installer certificate (.p12). Required to sign the .pkg.
        required: false
      apple-installer-certificate-password:
        description: Password for the Developer ID Installer certificate.
        required: false
      apple-keychain-password:
        description: Password for the temporary build keychain.
        required: false
      apple-id:
        description: Apple ID email used for notarization.
        required: false
      apple-app-specific-password:
        description: App-specific password for the Apple ID used by notarytool.
        required: false
      apple-team-id:
        description: Apple Developer Team ID.
        required: false
      certificate-sa-credentials:
        description: Google Cloud service-account JSON used to mint a KMS access token for jsign.
        required: false
      certificate-chain:
        description: Base64 PEM certificate chain for the Windows code-signing certificate.
        required: false
      certificate-store-type:
        description: jsign storetype for the Windows signing keystore (e.g. GOOGLECLOUD).
        required: false
      certificate-keystore:
        description: jsign keystore reference (e.g. Google Cloud KMS keyring resource).
        required: false
      certificate-key-name:
        description: jsign alias / key name within the keystore.
        required: false

concurrency: ${{ github.ref }}

jobs:
  create-draft-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      RELEASE_ID: ${{ steps.create-release.outputs.result }}
    steps:
      - run: "echo \"RELEASE_TAG=${GITHUB_REF#refs/tags/}\" >> \"$GITHUB_ENV\""
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0 https://github.com/actions/github-script/releases/tag/v9.0.0
        id: create-release
        if: startsWith(github.ref, 'refs/tags/')
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          result-encoding: string
          script: |
            try {
              const response = await github.rest.repos.createRelease({
                draft: true,
                generate_release_notes: true,
                name: process.env.RELEASE_TAG,
                owner: context.repo.owner,
                prerelease: false,
                repo: context.repo.repo,
                tag_name: process.env.RELEASE_TAG,
              });

              return response.data.id;
            } catch (error) {
              core.setFailed(error.message);
            }

  build-binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Set tray: false on any row to quickly disable that platform's
          # GUI tray build while still producing the core binary.
          # macOS .pkg builds inline on a native runner per arch (arm64 on
          # macos-15, amd64 on macos-15-intel): the tray needs CGO (Fyne) and
          # can't be cross-compiled, so it must build on its target arch.
          - runner: macos-15
            os: darwin
            arch: arm64
            tray: true
          - runner: macos-15-intel
            os: darwin
            arch: amd64
            tray: true
          - runner: ubuntu-latest
            os: freebsd
            arch: amd64
            tray: false
          - runner: ubuntu-latest
            os: freebsd
            arch: arm64
            tray: false
          - runner: ubuntu-latest
            os: linux
            arch: amd64
            tray: true
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
            tray: true
          - runner: windows-latest
            os: windows
            arch: amd64
            tray: true
          - runner: windows-11-arm
            os: windows
            arch: arm64
            tray: true
    runs-on: ${{ matrix.runner }}
    needs: [create-draft-release]
    # Only the capabilities this job actually uses: attest (id-token +
    # attestations) and upload release assets (contents). It pushes no packages
    # and touches no Actions/Checks/Statuses APIs.
    permissions:
      attestations: write
      contents: write
      id-token: write
    env:
      APPLICATION_NAME: ${{ inputs.application-name }}
    steps:
      - name: Set RELEASE_TAG (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $tagName = $env:GITHUB_REF -replace 'refs/tags/', ''
          echo "RELEASE_TAG=$tagName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Set RELEASE_TAG
        if: matrix.os != 'windows'
        run: "echo \"RELEASE_TAG=${GITHUB_REF#refs/tags/}\" >> \"$GITHUB_ENV\""
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          fetch-depth: '0'
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 https://github.com/actions/setup-go/releases/tag/v7.0.0
        with:
          go-version: ${{ inputs.go-version }}

      - name: Set up MSYS2 MinGW64 for Windows amd64 CGO
        if: matrix.os == 'windows' && matrix.arch == 'amd64' && matrix.tray
        id: msys2-amd64
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0 https://github.com/msys2/setup-msys2/releases/tag/v2.32.0
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc

      - name: Set up MSYS2 clangarm64 for Windows arm64 CGO
        if: matrix.os == 'windows' && matrix.arch == 'arm64' && matrix.tray
        id: msys2-arm64
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0 https://github.com/msys2/setup-msys2/releases/tag/v2.32.0
        with:
          msystem: CLANGARM64
          update: true
          install: >-
            mingw-w64-clang-aarch64-clang

      - name: Install Linux dependencies
        if: matrix.os == 'linux' && matrix.tray
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev wayland-protocols

      - name: Install FreeBSD tray build toolchain
        if: matrix.os == 'freebsd' && matrix.tray
        env:
          FYNE_CROSS_VERSION: ${{ inputs.fyne-cross-version }}
        run: |
          go install "github.com/fyne-io/fyne-cross@${FYNE_CROSS_VERSION}"

      - name: Build binary (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        env:
          MATRIX_OS: ${{ matrix.os }}
          MATRIX_ARCH: ${{ matrix.arch }}
          MATRIX_TRAY: ${{ matrix.tray }}
          MSYS2_AMD64_LOC: ${{ steps.msys2-amd64.outputs.msys2-location }}
          MSYS2_ARM64_LOC: ${{ steps.msys2-arm64.outputs.msys2-location }}
        run: |
          $env:GOOS = "$env:MATRIX_OS"
          $env:GOARCH = "$env:MATRIX_ARCH"

          if ("$env:MATRIX_ARCH" -eq "amd64") {
            $msys2Loc = "$env:MSYS2_AMD64_LOC"
            $env:CC = "$msys2Loc\mingw64\bin\gcc.exe"
            $env:CXX = "$msys2Loc\mingw64\bin\g++.exe"

            go env GOOS GOARCH CC CXX
            & $env:CC --version
          }

          if ("$env:MATRIX_ARCH" -eq "arm64") {
            $msys2Loc = "$env:MSYS2_ARM64_LOC"
            $env:CC = "$msys2Loc\clangarm64\bin\clang.exe"
            $env:CXX = "$msys2Loc\clangarm64\bin\clang++.exe"

            go env GOOS GOARCH CC CXX
            & $env:CC --version
          }

          make build
          if ("$env:MATRIX_TRAY" -eq "true") {
            make build-tray
          }
      - name: Build binary
        if: matrix.os != 'windows' && matrix.os != 'darwin'
        env:
          TRAY_ICON: ${{ inputs.tray-icon }}
          MATRIX_OS: ${{ matrix.os }}
          MATRIX_ARCH: ${{ matrix.arch }}
          MATRIX_TRAY: ${{ matrix.tray }}
        run: |
          GOOS="${MATRIX_OS}" GOARCH="${MATRIX_ARCH}" make build
          if [ "${MATRIX_TRAY}" = "true" ]; then
            if [ "${MATRIX_OS}" = "freebsd" ]; then
              "$(go env GOPATH)/bin/fyne-cross" freebsd -arch="${MATRIX_ARCH}" -name "${APPLICATION_NAME}-tray" -icon "${TRAY_ICON}" -env GOTOOLCHAIN=auto "./cmd/${APPLICATION_NAME}-tray"
            else
              GOOS="${MATRIX_OS}" GOARCH="${MATRIX_ARCH}" make build-tray
            fi
          fi

      # Sign Windows build
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0 https://github.com/actions/setup-java/releases/tag/v5.7.0
        if: ${{ startsWith(github.ref, 'refs/tags/') && matrix.os == 'windows' }}
        with:
          java-version: 21
          distribution: 'temurin'
      - id: 'auth'
        name: Authenticate with Google Cloud
        if: ${{ startsWith(github.ref, 'refs/tags/') && matrix.os == 'windows' }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0 https://github.com/google-github-actions/auth/releases/tag/v3.0.0
        with:
          credentials_json: '${{ secrets.certificate-sa-credentials }}'
      - name: Set up Cloud SDK
        if: ${{ startsWith(github.ref, 'refs/tags/') && matrix.os == 'windows' }}
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1 https://github.com/google-github-actions/setup-gcloud/releases/tag/v3.0.1
      - name: Sign Windows binaries
        if: ${{ startsWith(github.ref, 'refs/tags/') && matrix.os == 'windows' }}
        shell: pwsh
        env:
          CERTIFICATE_CHAIN: ${{ secrets.certificate-chain }}
          CERTIFICATE_STORE_TYPE: ${{ secrets.certificate-store-type }}
          CERTIFICATE_KEYSTORE: ${{ secrets.certificate-keystore }}
          CERTIFICATE_KEY_NAME: ${{ secrets.certificate-key-name }}
          MATRIX_TRAY: ${{ matrix.tray }}
          SIGNING_NAME: ${{ inputs.windows-signing-name != '' && inputs.windows-signing-name || inputs.application-name }}
          PROJECT_URL: ${{ inputs.project-url != '' && inputs.project-url || format('https://github.com/{0}', github.repository) }}
          TSA_URL: ${{ inputs.windows-tsa-url }}
        run: |
          Write-Host "Downloading jsign.jar"
          Invoke-WebRequest -Uri "https://github.com/ebourg/jsign/releases/download/6.0/jsign-6.0.jar" -OutFile "jsign.jar"

          Write-Host "Verifying jsign.jar checksum"
          $expectedHash = "05ca18d4ab7b8c2183289b5378d32860f0ea0f3bdab1f1b8cae5894fb225fa8a"
          $actualHash = (Get-FileHash -Path "jsign.jar" -Algorithm SHA256).Hash.ToLower()

          if ($actualHash -ne $expectedHash) {
            Write-Error "Hash verification failed for jsign.jar"
            Write-Error "Expected: $expectedHash"
            Write-Error "Actual: $actualHash"
            exit 1
          }

          [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String("$env:CERTIFICATE_CHAIN")) | Out-File -FilePath "codesign-chain.pem" -Encoding utf8

          $ACCESS_TOKEN = & gcloud auth print-access-token
          Write-Host "::add-mask::$ACCESS_TOKEN"

          # Sign every PE that will end up in the MSI. The outer MSI signature
          # only covers the OLE compound, not the embedded binaries — so each
          # .exe must be signed individually BEFORE wix bundles them.
          $binariesToSign = @("$($env:APPLICATION_NAME).exe")
          if ("$env:MATRIX_TRAY" -eq "true") {
            $binariesToSign += "$($env:APPLICATION_NAME)-tray.exe"
          }

          foreach ($filename in $binariesToSign) {
            if (-not (Test-Path $filename)) {
              Write-Error "Expected binary not found: $filename"
              exit 1
            }
            Write-Host "Signing $filename"
            # --tsretries/--tsretrywait are jsign's native timestamp retry
            # (the TSA is the part that flakes).
            java -jar jsign.jar `
              --storetype $env:CERTIFICATE_STORE_TYPE `
              --storepass "$ACCESS_TOKEN" `
              --keystore $env:CERTIFICATE_KEYSTORE `
              --alias $env:CERTIFICATE_KEY_NAME `
              --certfile "codesign-chain.pem" `
              --alg SHA-256 `
              --tsmode RFC3161 `
              --tsaurl "$env:TSA_URL" `
              --tsretries 3 `
              --tsretrywait 10 `
              --name "$env:SIGNING_NAME" `
              --url "$env:PROJECT_URL" `
              $filename
            if ($LASTEXITCODE -ne 0) { Write-Error "jsign failed on $filename"; exit 1 }

            # Independently confirm the PE is signed, chain-trusted AND
            # timestamped before it gets embedded in the MSI. jsign can exit 0
            # while the timestamp step silently failed, which this catches.
            $sig = Get-AuthenticodeSignature $filename
            if ($sig.Status -ne 'Valid') {
              Write-Error "signature not valid for ${filename}: $($sig.Status)"; exit 1
            }
            if ($null -eq $sig.TimeStamperCertificate) {
              Write-Error "signature for ${filename} is not timestamped"; exit 1
            }
            Write-Host "Signed + verified: $filename ($($sig.SignerCertificate.Subject))"
          }

          $ACCESS_TOKEN = $null
          # NOTE: jsign.jar and codesign-chain.pem are intentionally kept on
          # disk for the subsequent "Build MSI" step to reuse.

      - name: Install WiX toolset (Windows)
        if: ${{ startsWith(github.ref, 'refs/tags/') && matrix.os == 'windows' && matrix.tray }}
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 4.0.5
          # Make the new global tools dir discoverable in subsequent steps.
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$env:USERPROFILE\.dotnet\tools\wix.exe" --version

      - name: Build and sign MSI (Windows)
        if: ${{ startsWith(github.ref, 'refs/tags/') && matrix.os == 'windows' && matrix.tray }}
        shell: pwsh
        env:
          # Reuse the binaries the previous "Sign Windows binaries" step
          # already signed; build-msi.ps1 skips its internal `go build` when
          # both ADDER_EXE and ADDER_TRAY_EXE point at existing files.
          ADDER_EXE: ${{ github.workspace }}\${{ env.APPLICATION_NAME }}.exe
          ADDER_TRAY_EXE: ${{ github.workspace }}\${{ env.APPLICATION_NAME }}-tray.exe
          # MSI ProductVersion: strip leading "v" from the git tag (e.g. v0.39.1 -> 0.39.1).
          VERSION: ${{ env.RELEASE_TAG }}
          ARCH: ${{ matrix.arch }}
          # jsign: reuse the artefacts already on disk from the binary-sign step.
          JSIGN_JAR: ${{ github.workspace }}\jsign.jar
          JSIGN_KEYSTORE: ${{ secrets.certificate-keystore }}
          JSIGN_STORETYPE: ${{ secrets.certificate-store-type }}
          JSIGN_ALIAS: ${{ secrets.certificate-key-name }}
          JSIGN_CERTFILE: ${{ github.workspace }}\codesign-chain.pem
          JSIGN_TSAURL: ${{ inputs.windows-tsa-url }}
        run: |
          # Fresh, masked Google Cloud KMS access token for jsign --storepass.
          $ACCESS_TOKEN = & gcloud auth print-access-token
          Write-Host "::add-mask::$ACCESS_TOKEN"
          $env:JSIGN_STOREPASS = $ACCESS_TOKEN

          pwsh ./packaging/windows/build-msi.ps1
          if ($LASTEXITCODE -ne 0) { Write-Error "build-msi.ps1 failed"; exit 1 }

          $env:JSIGN_STOREPASS = $null
          $ACCESS_TOKEN = $null

          Write-Host "Cleaning up code-signing artefacts"
          Remove-Item -Path "codesign-chain.pem" -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "jsign.jar"          -Force -ErrorAction SilentlyContinue

      - name: Verify MSI signature (Windows)
        if: ${{ startsWith(github.ref, 'refs/tags/') && matrix.os == 'windows' && matrix.tray }}
        shell: pwsh
        env:
          MATRIX_ARCH: ${{ matrix.arch }}
        run: |
          # Locate signtool.exe in the Windows 10/11 SDK install (preinstalled
          # on windows-latest / windows-11-arm runners).
          $sdkRoot = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"
          if (-not (Test-Path $sdkRoot)) {
            Write-Error "Windows SDK not found at $sdkRoot"
            exit 1
          }
          $archDir = if ("$env:MATRIX_ARCH" -eq "arm64") { "arm64" } else { "x64" }
          $signtool = Get-ChildItem -Path $sdkRoot -Recurse -Filter signtool.exe `
            | Where-Object { $_.FullName -match "\\$archDir\\signtool\.exe$" } `
            | Sort-Object FullName -Descending `
            | Select-Object -First 1
          if (-not $signtool) {
            # Fall back to any signtool.exe under the SDK.
            $signtool = Get-ChildItem -Path $sdkRoot -Recurse -Filter signtool.exe `
              | Sort-Object FullName -Descending | Select-Object -First 1
          }
          if (-not $signtool) {
            Write-Error "signtool.exe not found under $sdkRoot"
            exit 1
          }
          Write-Host "Using signtool at: $($signtool.FullName)"

          $cleanVersion = "$env:RELEASE_TAG" -replace '^v', ''
          $msi = "dist\$($env:APPLICATION_NAME)-$cleanVersion-windows-$($env:MATRIX_ARCH).msi"
          if (-not (Test-Path $msi)) {
            Write-Error "MSI not found at $msi"
            exit 1
          }

          & $signtool.FullName verify /pa /v $msi
          if ($LASTEXITCODE -ne 0) {
            Write-Error "signtool verify failed for $msi"
            exit 1
          }
          Write-Host "MSI signature verified: $msi"

      # Build macOS .pkg installer
      #
      # On tag pushes: import both Developer ID certs, store notarytool creds,
      # then run build-pkg.sh which produces a signed + notarized + stapled
      # .pkg under dist/. On non-tag pushes: run build-pkg.sh unsigned to
      # validate the packaging path on every push.
      - name: Build macOS .pkg
        if: matrix.os == 'darwin'
        env:
          IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/') }}
          APPLE_CERTIFICATE: ${{ secrets.apple-certificate }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.apple-certificate-password }}
          APPLE_INSTALLER_CERTIFICATE: ${{ secrets.apple-installer-certificate }}
          APPLE_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.apple-installer-certificate-password }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.apple-keychain-password }}
          APPLE_ID: ${{ secrets.apple-id }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.apple-app-specific-password }}
          APPLE_TEAM_ID: ${{ secrets.apple-team-id }}
          APPLE_SIGNING_ORG: ${{ inputs.apple-signing-org }}
          MATRIX_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail

          if [ "${IS_RELEASE}" = "true" ]; then
            echo "::group::Import Apple Developer ID certificates"
            echo -n "${APPLE_CERTIFICATE}"           | base64 --decode -o apple_app.p12
            echo -n "${APPLE_INSTALLER_CERTIFICATE}" | base64 --decode -o apple_installer.p12

            security create-keychain  -p "${APPLE_KEYCHAIN_PASSWORD}" build.keychain
            security default-keychain -s build.keychain
            security set-keychain-settings -lut 21600 build.keychain
            security unlock-keychain  -p "${APPLE_KEYCHAIN_PASSWORD}" build.keychain

            # Application cert signs binaries / .app; installer cert signs the pkg.
            security import apple_app.p12       -k build.keychain -P "${APPLE_CERTIFICATE_PASSWORD}"           -T /usr/bin/codesign
            security import apple_installer.p12 -k build.keychain -P "${APPLE_INSTALLER_CERTIFICATE_PASSWORD}" -T /usr/bin/productsign
            security set-key-partition-list -S apple-tool:,apple:,codesign:,productsign: -s -k "${APPLE_KEYCHAIN_PASSWORD}" build.keychain

            rm -f apple_app.p12 apple_installer.p12
            echo "::endgroup::"

            echo "::group::Store notarytool credentials"
            xcrun notarytool store-credentials "${APPLICATION_NAME}-notary" \
              --apple-id "${APPLE_ID}" \
              --team-id  "${APPLE_TEAM_ID}" \
              --password "${APPLE_APP_SPECIFIC_PASSWORD}"
            echo "::endgroup::"

            export SIGNING_IDENTITY="Developer ID Application: ${APPLE_SIGNING_ORG} (${APPLE_TEAM_ID})"
            export INSTALLER_IDENTITY="Developer ID Installer: ${APPLE_SIGNING_ORG} (${APPLE_TEAM_ID})"
            export TEAM_ID="${APPLE_TEAM_ID}"
            export NOTARY_PROFILE="${APPLICATION_NAME}-notary"
            export VERSION="${RELEASE_TAG#v}"
          fi

          export ARCH="${MATRIX_ARCH}"
          ./packaging/macos/build-pkg.sh

          if [ "${IS_RELEASE}" = "true" ]; then
            echo "::group::Verify pkg with spctl (must be accepted + Notarized Developer ID)"
            PKG_PATH="dist/${APPLICATION_NAME}-${VERSION}-darwin-${MATRIX_ARCH}.pkg"
            spctl_out=$(spctl -a -vv --type install "${PKG_PATH}" 2>&1)
            echo "${spctl_out}"
            echo "${spctl_out}" | grep -q 'accepted'
            echo "${spctl_out}" | grep -q 'Notarized Developer ID'
            echo "::endgroup::"
          fi

      - name: Upload MSI release asset (Windows)
        if: startsWith(github.ref, 'refs/tags/') && matrix.os == 'windows' && matrix.tray
        shell: pwsh
        env:
          MATRIX_OS: ${{ matrix.os }}
          MATRIX_ARCH: ${{ matrix.arch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-draft-release.outputs.RELEASE_ID }}
        run: |
          $cleanVersion = "$env:RELEASE_TAG" -replace '^v', ''
          $msiPath  = "dist\$($env:APPLICATION_NAME)-$cleanVersion-windows-$($env:MATRIX_ARCH).msi"
          # Asset name follows the existing convention:
          # <app>-<RELEASE_TAG>-<os>-<arch>.<ext> (RELEASE_TAG keeps the leading "v").
          $assetName = "$($env:APPLICATION_NAME)-$($env:RELEASE_TAG)-$($env:MATRIX_OS)-$($env:MATRIX_ARCH).msi"
          if (-not (Test-Path $msiPath)) {
            Write-Error "MSI not found at $msiPath"
            exit 1
          }
          Write-Host "Uploading $msiPath as $assetName"
          $headers = @{
            "Authorization" = "token $env:GH_TOKEN"
            "Content-Type" = "application/octet-stream"
          }
          $uploadUrl = "https://uploads.github.com/repos/$($env:GITHUB_REPOSITORY)/releases/$($env:RELEASE_ID)/assets?name=$assetName"
          Invoke-RestMethod -Uri $uploadUrl -Method Post -Headers $headers -InFile $msiPath

      - name: Upload release asset (macOS pkg)
        if: startsWith(github.ref, 'refs/tags/') && matrix.os == 'darwin'
        env:
          MATRIX_OS: ${{ matrix.os }}
          MATRIX_ARCH: ${{ matrix.arch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-draft-release.outputs.RELEASE_ID }}
        run: |
          set -euo pipefail
          _version="${RELEASE_TAG#v}"
          _filename="${APPLICATION_NAME}-${_version}-${MATRIX_OS}-${MATRIX_ARCH}.pkg"
          _path="dist/${_filename}"
          curl --fail --show-error --silent \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @"${_path}" \
            "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=${_filename}"

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/') && matrix.os != 'windows' && matrix.os != 'darwin'
        env:
          MATRIX_OS: ${{ matrix.os }}
          MATRIX_ARCH: ${{ matrix.arch }}
          MATRIX_TRAY: ${{ matrix.tray }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-draft-release.outputs.RELEASE_ID }}
        run: |
          set -euo pipefail
          # Build from runtime env (not GitHub expression expansion) so a
          # crafted tag name can't inject shell; quote all paths.
          _filename="${APPLICATION_NAME}-${RELEASE_TAG}-${MATRIX_OS}-${MATRIX_ARCH}.tar.gz"
          # Ship the GUI tray binary next to the core binary on tray-enabled
          # rows so every built (and later attested) subject is downloadable.
          _files=("${APPLICATION_NAME}")
          if [ "${MATRIX_TRAY}" = "true" ] && [ -f "${APPLICATION_NAME}-tray" ]; then
            _files+=("${APPLICATION_NAME}-tray")
          fi
          tar czf "${_filename}" "${_files[@]}"
          curl --fail --show-error --silent \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @"${_filename}" \
            "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=${_filename}"

      - name: Compute MSI path (Windows)
        if: startsWith(github.ref, 'refs/tags/') && matrix.os == 'windows' && matrix.tray
        shell: pwsh
        env:
          MATRIX_ARCH: ${{ matrix.arch }}
        run: |
          $cleanVersion = "$env:RELEASE_TAG" -replace '^v', ''
          $msiPath = "dist\$($env:APPLICATION_NAME)-$cleanVersion-windows-$($env:MATRIX_ARCH).msi"
          "MSI_PATH=$msiPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Attest MSI (Windows)
        if: startsWith(github.ref, 'refs/tags/') && matrix.os == 'windows' && matrix.tray
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2 https://github.com/actions/attest/releases/tag/v4.2.2
        with:
          subject-path: ${{ env.MSI_PATH }}

      - name: Attest pkg (macOS)
        if: startsWith(github.ref, 'refs/tags/') && matrix.os == 'darwin'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2 https://github.com/actions/attest/releases/tag/v4.2.2
        with:
          subject-path: 'dist/*.pkg'

      - name: Attest binary
        if: startsWith(github.ref, 'refs/tags/') && matrix.os != 'windows' && matrix.os != 'darwin'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2 https://github.com/actions/attest/releases/tag/v4.2.2
        with:
          subject-path: '${{ env.APPLICATION_NAME }}'

      - name: Attest tray binary
        if: startsWith(github.ref, 'refs/tags/') && matrix.os != 'windows' && matrix.os != 'darwin' && matrix.tray
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2 https://github.com/actions/attest/releases/tag/v4.2.2
        with:
          subject-path: '${{ env.APPLICATION_NAME }}-tray'

  build-images:
    needs: [create-draft-release]
    # Push images (packages) and attest them (id-token + attestations). It only
    # reads the repo (checkout) and writes no repository contents.
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - run: "echo \"RELEASE_TAG=${GITHUB_REF#refs/tags/}\" >> \"$GITHUB_ENV\""
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          fetch-depth: '0'
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0 https://github.com/docker/setup-buildx-action/releases/tag/v4.3.0
      - name: Login to Docker Hub
        if: inputs.docker-image != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0 https://github.com/docker/login-action/releases/tag/v4.6.0
        with:
          username: ${{ inputs.dockerhub-username }}
          password: ${{ secrets.docker-password }} # uses token
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0 https://github.com/docker/login-action/releases/tag/v4.6.0
        with:
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0 https://github.com/docker/metadata-action/releases/tag/v6.2.0
        with:
          images: |
            ${{ inputs.docker-image }}
            ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
            suffix=-${{ matrix.arch }}
          tags: |
            # Only version, no revision
            type=match,pattern=v(.*)-(.*),group=1
            # branch
            type=ref,event=branch
            # semver
            type=semver,pattern={{version}}
      - name: Build images
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0 https://github.com/docker/build-push-action/releases/tag/v7.3.0
        with:
          outputs: "type=registry,push=true"
          platforms: linux/${{ matrix.arch }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Attest Docker Hub image
        if: inputs.docker-image != ''
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2 https://github.com/actions/attest/releases/tag/v4.2.2
        with:
          subject-name: index.docker.io/${{ inputs.docker-image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Attest GHCR image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2 https://github.com/actions/attest/releases/tag/v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  build-image-manifest:
    needs: [build-images]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0 https://github.com/docker/setup-buildx-action/releases/tag/v4.3.0
      - name: Login to Docker Hub
        if: inputs.docker-image != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0 https://github.com/docker/login-action/releases/tag/v4.6.0
        with:
          username: ${{ inputs.dockerhub-username }}
          password: ${{ secrets.docker-password }} # uses token
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0 https://github.com/docker/login-action/releases/tag/v4.6.0
        with:
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0 https://github.com/docker/metadata-action/releases/tag/v6.2.0
        with:
          images: |
            ${{ inputs.docker-image }}
            ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            # Only version, no revision
            type=match,pattern=v(.*)-(.*),group=1
            # branch
            type=ref,event=branch
            # semver
            type=semver,pattern={{version}}
      - name: manifest-create
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          # `docker buildx imagetools create` copies the complete source OCI
          # index for each arch tag — the platform image AND its
          # build-provenance / SBOM attestation descriptors — into the merged
          # manifest. Plain `docker manifest create` instead rejects those
          # `unknown/unknown` attestation entries with "must have an OS and
          # Architecture", so the earlier per-arch attestations are preserved
          # here rather than dropped.
          # Word-splitting of the env-sourced tag list is intentional.
          # shellcheck disable=SC2086
          for t in ${TAGS}; do
            docker buildx imagetools create -t "${t}" "${t}-amd64" "${t}-arm64"
          done
      # Checkout repo so README.md is available for next step
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          persist-credentials: false
      # Update Docker Hub from README
      - name: Docker Hub Description
        if: inputs.docker-image != '' && inputs.description != ''
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0 https://github.com/peter-evans/dockerhub-description/releases/tag/v5.0.0
        with:
          username: ${{ inputs.dockerhub-username }}
          password: ${{ secrets.docker-password }}
          repository: ${{ inputs.docker-image }}
          readme-filepath: ./README.md
          short-description: ${{ inputs.description }}

  scan-images:
    # Trivy resolves a multi-arch tag to linux/amd64 only, so scanning the
    # merged manifest would silently skip the arm64 filesystem and package set.
    # This matrix scans each per-architecture image on its native runner and
    # uploads a distinct SARIF category per arch so both result sets are kept.
    #
    # The job itself is intentionally NOT gated on enable-trivy-scan: it is a
    # required dependency of finalize-release, and a skipped dependency would
    # skip finalize-release too (leaving the release drafted forever). Instead
    # the scan/upload STEPS are gated, so with scanning disabled the job still
    # completes successfully as a no-op and the release gate stays intact.
    needs: [build-images]
    permissions:
      contents: read
      packages: read
      # Trivy uploads its SARIF report to the Security tab.
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Login to GHCR
        if: inputs.enable-trivy-scan
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0 https://github.com/docker/login-action/releases/tag/v4.6.0
        with:
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
      - id: meta
        if: inputs.enable-trivy-scan
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0 https://github.com/docker/metadata-action/releases/tag/v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            # Only version, no revision
            type=match,pattern=v(.*)-(.*),group=1
            # branch
            type=ref,event=branch
            # semver
            type=semver,pattern={{version}}
      - name: Run Trivy vulnerability scanner (${{ matrix.arch }})
        # Only scan when enabled and a concrete image version was resolved. On
        # plain branch pushes docker/metadata-action can leave `version` empty,
        # which would make scan-ref tagless and fail Trivy — failing an
        # otherwise-successful publish. Skipping keeps the scan on-by-default for
        # releases without breaking branch publishes. The per-arch tag (…-amd64 /
        # …-arm64) is the single-platform image build-images pushed, so the scan
        # targets that architecture's real filesystem regardless of the runner.
        if: inputs.enable-trivy-scan && steps.meta.outputs.version != ''
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 https://github.com/aquasecurity/trivy-action/releases/tag/v0.36.0
        env:
          # The per-arch tag (…-amd64 / …-arm64) is a single-platform OCI index.
          # Without an explicit platform Trivy defaults to linux/amd64 when
          # resolving the remote index, so on the arm64 runner it fails with
          # "no child with platform linux/amd64 in index …-arm64". Pin the
          # platform to this matrix row's architecture so Trivy resolves the
          # matching child regardless of the runner's default.
          TRIVY_PLATFORM: 'linux/${{ matrix.arch }}'
        with:
          scan-type: 'image'
          scan-ref: 'ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}-${{ matrix.arch }}'
          format: 'sarif'
          output: 'trivy-results-${{ matrix.arch }}.sarif'
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'
      - name: Upload Trivy scan results to GitHub Security tab (${{ matrix.arch }})
        # Distinct category per arch: upload-sarif keys results by category, so a
        # shared category would let the arm64 upload overwrite the amd64 one.
        if: always() && inputs.enable-trivy-scan && steps.meta.outputs.version != ''
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7 https://github.com/github/codeql-action/releases/tag/codeql-bundle-v4.37.7
        with:
          sarif_file: 'trivy-results-${{ matrix.arch }}.sarif'
          category: 'trivy-${{ matrix.arch }}'

  finalize-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [create-draft-release, build-binaries, build-images, build-image-manifest, scan-images]
    # No always(): a job with `needs` runs only when every listed job succeeded.
    # So if any binary, installer, image, manifest, or image-scan job fails, this
    # job is skipped and the release stays a draft for owner-directed recovery
    # instead of being published without its missing assets or before the
    # vulnerability scan and SARIF upload have finished.
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0 https://github.com/actions/github-script/releases/tag/v9.0.0
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_ID: ${{ needs.create-draft-release.outputs.RELEASE_ID }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: Number(process.env.RELEASE_ID),
                draft: false,
              });
            } catch (error) {
              core.setFailed(error.message);
            }
      # This updates the documentation on pkg.go.dev and the latest version available via the Go module proxy
      - name: Pull new module version
        if: startsWith(github.ref, 'refs/tags/')
        uses: andrewslotin/go-proxy-pull-action@00af8a5a49c844d6dde0bbbc116b72d8fd7ae97c # v1.5.0 https://github.com/andrewslotin/go-proxy-pull-action/releases/tag/v1.5.0
