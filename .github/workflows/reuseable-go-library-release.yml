name: Reusable Go Library Release

# Release workflow for Go library modules. On a version tag it creates a
# GitHub release, optionally attaches example binaries, then nudges the Go
# module proxy / pkg.go.dev to fetch the new version. Callers trigger this on
# `push: tags: ['v*.*.*']`; the job self-guards to tag refs so an accidental
# branch trigger is a no-op.
#
# Libraries that ship runnable example programs can opt in to `build-examples`
# to cross-compile each example and attach the binaries to the release; the
# feature is off by default so every other library caller is unaffected.

on:
  workflow_call:
    inputs:
      prerelease:
        description: Mark the created GitHub release as a prerelease.
        required: false
        type: boolean
        default: false
      generate-release-notes:
        description: Auto-generate release notes for the created GitHub release.
        required: false
        type: boolean
        default: true
      pull-go-module:
        description: Trigger the Go module proxy / pkg.go.dev to fetch the new version after release.
        required: false
        type: boolean
        default: true
      build-examples:
        description: Cross-compile the module's example programs and attach the binaries to the release.
        required: false
        type: boolean
        default: false
      examples-dir:
        description: Directory holding one subdirectory per example program (each built to a repo-root binary named after its directory).
        required: false
        type: string
        default: examples
      example-build-command:
        description: Command that builds every example, honouring GOOS/GOARCH, into repo-root binaries named after their directories.
        required: false
        type: string
        default: make build
      example-os-matrix:
        description: JSON array of GOOS values to build example binaries for.
        required: false
        type: string
        default: '["linux","darwin","freebsd","windows"]'
      example-arch-matrix:
        description: JSON array of GOARCH values to build example binaries for.
        required: false
        type: string
        default: '["amd64","arm64"]'
      go-version:
        description: Go version used to build the example binaries.
        required: false
        type: string
        default: 1.26.x
      submodules:
        description: Whether to check out git submodules when building the example binaries.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  create-release:
    name: create-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    outputs:
      RELEASE_ID: ${{ steps.create-release.outputs.result }}
    steps:
      - name: Set RELEASE_TAG
        run: echo "RELEASE_TAG=${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"
      - name: Create release
        id: create-release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0 https://github.com/actions/github-script/releases/tag/v9.0.0
        env:
          GENERATE_RELEASE_NOTES: ${{ inputs.generate-release-notes }}
          PRERELEASE: ${{ inputs.prerelease }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          result-encoding: string
          script: |
            try {
              const response = await github.rest.repos.createRelease({
                draft: true,
                generate_release_notes: process.env.GENERATE_RELEASE_NOTES === 'true',
                name: process.env.RELEASE_TAG,
                owner: context.repo.owner,
                prerelease: process.env.PRERELEASE === 'true',
                repo: context.repo.repo,
                tag_name: process.env.RELEASE_TAG,
              });

              return response.data.id;
            } catch (error) {
              core.setFailed(error.message);
            }
  publish-examples:
    name: publish-examples
    # Opt-in and tag-only: skipped for library callers that leave build-examples
    # unset, and never runs on branch triggers.
    if: startsWith(github.ref, 'refs/tags/') && inputs.build-examples
    needs: [create-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        os: ${{ fromJson(inputs.example-os-matrix) }}
        arch: ${{ fromJson(inputs.example-arch-matrix) }}
    env:
      RELEASE_ID: ${{ needs.create-release.outputs.RELEASE_ID }}
      MATRIX_OS: ${{ matrix.os }}
      MATRIX_ARCH: ${{ matrix.arch }}
      EXAMPLES_DIR: ${{ inputs.examples-dir }}
    steps:
      - name: Set RELEASE_TAG
        run: echo "RELEASE_TAG=${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: ${{ inputs.submodules }}
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6 https://github.com/actions/setup-go/releases/tag/v6.0.0
        with:
          go-version: ${{ inputs.go-version }}
      - name: Build example binaries
        env:
          BUILD_COMMAND: ${{ inputs.example-build-command }}
        run: GOOS="$MATRIX_OS" GOARCH="$MATRIX_ARCH" $BUILD_COMMAND
      # The build command writes one repo-root binary per example directory
      # (named after the directory). Stage them under dist/ with release-asset
      # names so both the upload and the attestation glob stay simple.
      - name: Stage example binaries
        run: |
          set -euo pipefail
          mkdir -p dist
          for dir in "$EXAMPLES_DIR"/*/; do
            name="$(basename "$dir")"
            src="$name"
            asset="${name}-${RELEASE_TAG}-${MATRIX_OS}-${MATRIX_ARCH}"
            if [ -f "${src}.exe" ]; then
              src="${src}.exe"
              asset="${asset}.exe"
            fi
            if [ ! -f "$src" ]; then
              echo "no binary produced for example '${name}'" >&2
              exit 1
            fi
            mv "$src" "dist/${asset}"
          done
          ls -1 dist
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for f in dist/*; do
            name="$(basename "$f")"
            curl --fail --silent --show-error \
              -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$f" \
              "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=${name}"
          done
      - name: Attest example binaries
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2 https://github.com/actions/attest/releases/tag/v4.2.2
        with:
          subject-path: dist/*

  publish-release:
    name: publish-release
    if: >-
      !cancelled() &&
      needs.create-release.result == 'success' &&
      (needs.publish-examples.result == 'success' || needs.publish-examples.result == 'skipped')
    needs: [create-release, publish-examples]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0 https://github.com/actions/github-script/releases/tag/v9.0.0
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.RELEASE_ID }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.repos.updateRelease({
              draft: false,
              owner: context.repo.owner,
              release_id: Number(process.env.RELEASE_ID),
              repo: context.repo.repo,
            });

  pull-go-module:
    name: pull-go-module
    if: needs.publish-release.result == 'success' && inputs.pull-go-module
    needs: [publish-release]
    runs-on: ubuntu-latest
    steps:
      - name: Pull new module version
        uses: andrewslotin/go-proxy-pull-action@00af8a5a49c844d6dde0bbbc116b72d8fd7ae97c # v1.5.0 https://github.com/andrewslotin/go-proxy-pull-action/releases/tag/v1.5.0
