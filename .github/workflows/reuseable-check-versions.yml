name: Reusable Check Versions

# Generic "check upstream image versions and open update PRs" workflow.
#
# It compares the versions referenced in a docker-compose file against the
# latest matching tags of the upstream images (GHCR or Docker Hub) described in
# an upstream-versions JSON config, and opens a pull request for every package
# that has a newer version available.
#
# All repository-specific values (config path, compose file, updater script,
# base branch, git identity) are optional inputs with defaults, so the workflow
# stays generic and can be reused by any compose-stack repository.

on:
  workflow_call:
    inputs:
      upstream-config:
        description: Path to the upstream-versions JSON config.
        required: false
        type: string
        default: "scripts/upstream-versions.json"
      compose-file:
        description: Path to the docker-compose file whose version defaults are updated.
        required: false
        type: string
        default: "docker-compose.yaml"
      add-version-script:
        description: Path to the script that updates the compose default for a package (called as `<script> <package> <version>`).
        required: false
        type: string
        default: "scripts/add-version.sh"
      base-branch:
        description: Base branch that update pull requests target.
        required: false
        type: string
        default: "main"
      git-user-name:
        description: git author/committer name used for the automated commits.
        required: false
        type: string
        default: "github-actions[bot]"
      git-user-email:
        description: git author/committer email used for the automated commits.
        required: false
        type: string
        default: "github-actions[bot]@users.noreply.github.com"
      runs-on:
        description: Runner label the job executes on.
        required: false
        type: string
        default: "ubuntu-latest"
    secrets:
      token:
        description: >-
          Token used to read upstream versions, push branches, and open pull
          requests. Needs contents:write and pull-requests:write. Falls back to
          the job's GITHUB_TOKEN when not supplied.
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  check-versions:
    name: Check for new upstream versions
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.token || github.token }}

      - name: Check and create PRs for new versions
        env:
          GH_TOKEN: ${{ secrets.token || github.token }}
          UPSTREAM_CONFIG: ${{ inputs.upstream-config }}
          COMPOSE_FILE: ${{ inputs.compose-file }}
          ADD_VERSION_SCRIPT: ${{ inputs.add-version-script }}
          BASE_BRANCH: ${{ inputs.base-branch }}
          GIT_USER_NAME: ${{ inputs.git-user-name }}
          GIT_USER_EMAIL: ${{ inputs.git-user-email }}
        run: |
          set -euo pipefail

          # Configure git
          git config user.name "$GIT_USER_NAME"
          git config user.email "$GIT_USER_EMAIL"

          UPSTREAM_CONFIG="${UPSTREAM_CONFIG:-scripts/upstream-versions.json}"
          COMPOSE_FILE="${COMPOSE_FILE:-docker-compose.yaml}"
          ADD_VERSION_SCRIPT="${ADD_VERSION_SCRIPT:-scripts/add-version.sh}"
          BASE_BRANCH="${BASE_BRANCH:-main}"

          if [[ ! -f "$UPSTREAM_CONFIG" ]]; then
            echo "ERROR: Upstream config not found: $UPSTREAM_CONFIG"
            exit 1
          fi

          if [[ ! -f "$COMPOSE_FILE" ]]; then
            echo "ERROR: Compose file not found: $COMPOSE_FILE"
            exit 1
          fi

          PACKAGES=$(jq -r 'keys[]' "$UPSTREAM_CONFIG")

          for PACKAGE in $PACKAGES; do
            echo "=========================================="
            echo "Checking package: $PACKAGE"
            echo "=========================================="

            COMPOSE_VAR=$(jq -r --arg pkg "$PACKAGE" '.[$pkg].compose_var' "$UPSTREAM_CONFIG")
            GHCR_IMAGE=$(jq -r --arg pkg "$PACKAGE" '.[$pkg].ghcr_image // ""' "$UPSTREAM_CONFIG")
            DOCKER_IMAGE=$(jq -r --arg pkg "$PACKAGE" '.[$pkg].docker_image // ""' "$UPSTREAM_CONFIG")
            TAG_PREFIX=$(jq -r --arg pkg "$PACKAGE" '.[$pkg].tag_prefix // ""' "$UPSTREAM_CONFIG")
            TAG_REGEX=$(jq -r --arg pkg "$PACKAGE" '.[$pkg].tag_regex // ""' "$UPSTREAM_CONFIG")

            if [[ "$COMPOSE_VAR" == "null" || -z "$COMPOSE_VAR" ]]; then
              echo "  WARNING: compose_var not set for $PACKAGE, skipping"
              continue
            fi

            if [[ -z "$GHCR_IMAGE" && -z "$DOCKER_IMAGE" ]]; then
              echo "  WARNING: No image source defined for $PACKAGE, skipping"
              continue
            fi

            if [[ -z "$TAG_REGEX" ]]; then
              TAG_REGEX='^[0-9]+(\.[0-9]+){2,3}$'
            fi

            if [[ -n "$GHCR_IMAGE" ]]; then
              echo "  Using GHCR image: $GHCR_IMAGE"
              GHCR_ORG="${GHCR_IMAGE%%/*}"
              GHCR_PKG="${GHCR_IMAGE#*/}"

              UPSTREAM_TAG=$(gh api "/orgs/${GHCR_ORG}/packages/container/${GHCR_PKG}/versions" --paginate \
                --jq '.[].metadata.container.tags[]' 2>/dev/null \
                | grep -E "$TAG_REGEX" \
                | sort -V | tail -1 || echo "")

              if [[ -z "$UPSTREAM_TAG" ]]; then
                echo "  WARNING: Could not fetch tags from GHCR for $GHCR_IMAGE, skipping"
                continue
              fi

              SOURCE_REF="ghcr.io/${GHCR_IMAGE}:${UPSTREAM_TAG}"
            else
              echo "  Using Docker Hub image: $DOCKER_IMAGE"

              UPSTREAM_TAG=$(python3 - "$DOCKER_IMAGE" "$TAG_REGEX" <<'PY' || echo ""
          import json
          import re
          import sys
          import urllib.request

          image = sys.argv[1]
          regex = re.compile(sys.argv[2])

          page = 1
          page_size = 100
          found = []

          while True:
              url = f"https://hub.docker.com/v2/repositories/{image}/tags?page={page}&page_size={page_size}"
              with urllib.request.urlopen(url) as resp:
                  data = json.loads(resp.read().decode("utf-8"))

              for item in data.get("results", []):
                  tag = item.get("name", "")
                  if regex.match(tag):
                      found.append(tag)

              if not data.get("next"):
                  break
              page += 1

          if not found:
            sys.exit(1)

          def normalize(tag):
            if tag.startswith("v"):
              tag = tag[1:]
            parts = re.split(r"[.-]", tag)
            key = []
            for part in parts:
              if part.isdigit():
                key.append(int(part))
              else:
                key.append(part)
            return key

          found.sort(key=normalize)
          print(found[-1])
          PY
          )

              if [[ -z "$UPSTREAM_TAG" ]]; then
                echo "  WARNING: Could not fetch tags from Docker Hub for $DOCKER_IMAGE, skipping"
                continue
              fi

              SOURCE_REF="docker.io/${DOCKER_IMAGE}:${UPSTREAM_TAG}"
            fi

            if [[ -n "$TAG_PREFIX" && "$UPSTREAM_TAG" == "$TAG_PREFIX"* ]]; then
              UPSTREAM_VERSION="${UPSTREAM_TAG#"${TAG_PREFIX}"}"
            else
              UPSTREAM_VERSION="$UPSTREAM_TAG"
            fi

            echo "  Upstream tag: $UPSTREAM_TAG"
            echo "  Upstream version: $UPSTREAM_VERSION"

            LOCAL_VERSION=$(python3 - "$COMPOSE_FILE" "$COMPOSE_VAR" <<'PY' || echo ""
          import re
          import sys

          compose_file = sys.argv[1]
          compose_var = sys.argv[2]

          pattern = re.compile(r"\$\{" + re.escape(compose_var) + r":-([^}]+)\}")
          with open(compose_file, "r") as fh:
              data = fh.read()

          match = pattern.search(data)
          if not match:
              sys.exit(1)

          print(match.group(1))
          PY
          )

            if [[ -z "$LOCAL_VERSION" ]]; then
              echo "  WARNING: Could not find ${COMPOSE_VAR} default in $COMPOSE_FILE, skipping"
              continue
            fi

            echo "  Local version: $LOCAL_VERSION"

            if [[ "$UPSTREAM_VERSION" == "$LOCAL_VERSION" ]]; then
              echo "  Already up to date"
              continue
            fi

            echo "  New version available: $UPSTREAM_VERSION"

            # Verify image exists before updating
            echo "  Verifying image: $SOURCE_REF"
            if ! docker manifest inspect "$SOURCE_REF" > /dev/null 2>&1; then
              echo "  WARNING: Image not found or not accessible: $SOURCE_REF, skipping"
              continue
            fi

            BRANCH_NAME="chore/${PACKAGE}-${UPSTREAM_VERSION}"
            EXISTING_PR=$(gh pr list --head "$BRANCH_NAME" --json number --jq '.[0].number' 2>/dev/null || echo "")
            if [[ -n "$EXISTING_PR" ]]; then
              echo "  PR #$EXISTING_PR already exists for this version, skipping"
              continue
            fi

            echo "  Updating $COMPOSE_FILE..."
            if ! "$ADD_VERSION_SCRIPT" "$PACKAGE" "$UPSTREAM_VERSION"; then
              echo "  WARNING: Failed to update $COMPOSE_FILE for $PACKAGE, skipping"
              git checkout -- "$COMPOSE_FILE" || true
              continue
            fi

            git checkout -b "$BRANCH_NAME"
            git add "$COMPOSE_FILE"
            git commit -m "chore: ${PACKAGE} ${UPSTREAM_VERSION}"

            echo "  Pushing branch..."
            git push -u origin "$BRANCH_NAME"

            echo "  Creating PR..."
            PR_BODY="## Summary
          - Updates ${PACKAGE} to version ${UPSTREAM_VERSION}
          - Source: ${SOURCE_REF}

          ## Test plan
          - [ ] CI validation passes
          - [ ] Manual testing if needed

          🤖 Generated automatically by check-versions workflow"

            gh pr create \
              --title "chore: ${PACKAGE} ${UPSTREAM_VERSION}" \
              --body "$PR_BODY" \
              --base "$BASE_BRANCH" \
              --head "$BRANCH_NAME"

            git checkout "$BASE_BRANCH"

            echo "  PR created successfully!"
          done

          echo ""
          echo "=========================================="
          echo "Version check complete"
          echo "=========================================="
