name: Reusable OCI Helm Publish

on:
  workflow_call:
    inputs:
      helm-version:
        description: Helm version used to package and push charts.
        required: false
        type: string
        default: v4.3.1

permissions:
  contents: read

jobs:
  publish:
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && !github.event.deleted
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changed charts
        id: charts
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          FETCH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          import re
          import subprocess

          before, after = os.environ['BEFORE'], os.environ['AFTER']
          if not all(re.fullmatch(r'[0-9a-f]{40}', ref) for ref in (before, after)):
              raise SystemExit('Expected push commit SHAs')
          if before == '0' * 40:
              command = ['git', 'ls-tree', '-r', '--name-only', '-z', after, '--', 'charts/']
          else:
              # A force push can leave its previous tip outside the fetched history.
              if subprocess.run(['git', 'cat-file', '-e', before + '^{commit}'],
                                stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL).returncode:
                  header = 'AUTHORIZATION: basic ' + base64.b64encode(
                      ('x-access-token:' + os.environ['FETCH_TOKEN']).encode()).decode()
                  fetch_env = dict(os.environ, GIT_CONFIG_COUNT='1',
                                   GIT_CONFIG_KEY_0='http.' + os.environ['GITHUB_SERVER_URL'] + '/.extraheader',
                                   GIT_CONFIG_VALUE_0=header)
                  subprocess.run(['git', 'fetch', '--no-tags', 'origin', before], env=fetch_env, check=True)
              command = ['git', 'diff', '--name-only', '--no-renames', '-z', before, after, '--', 'charts/']
          paths = subprocess.check_output(command).decode().split('\0')
          charts = set()
          for path in paths:
              parts = path.split('/')
              if len(parts) < 3:
                  continue
              chart = Path(*parts[:2])
              if (chart / 'Chart.yaml').is_file():
                  if chart.is_symlink() or (chart / 'Chart.yaml').is_symlink():
                      raise SystemExit(f'Chart must be inside the repository: {chart}')
                  charts.add(str(chart))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('charts=' + json.dumps(sorted(charts)) + '\n')
          PY

      - name: Install Helm
        if: steps.charts.outputs.charts != '[]'
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ inputs.helm-version }}

      - name: Verify chart version bumps
        if: steps.charts.outputs.charts != '[]'
        shell: bash
        env:
          CHARTS: ${{ steps.charts.outputs.charts }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import tempfile

          def version(chart):
              metadata = subprocess.check_output(['helm', 'show', 'chart', str(chart)], text=True)
              matches = re.findall(r'^version:\s*(\S+)\s*$', metadata, re.MULTILINE)
              if len(matches) != 1:
                  raise SystemExit(f'Expected one chart version in {chart}')
              return matches[0].strip('"\'')

          def precedence(value):
              value = value.split('+', 1)[0].removeprefix('v')
              core, separator, prerelease = value.partition('-')
              numbers = core.split('.')
              if len(numbers) != 3 or not all(part.isdigit() for part in numbers):
                  raise SystemExit(f'Invalid chart version: {value}')
              identifiers = tuple(
                  (0, int(part)) if part.isdigit() else (1, part)
                  for part in prerelease.split('.') if part
              )
              return tuple(map(int, numbers)), not separator, identifiers

          before = os.environ['BEFORE']
          if before != '0' * 40:
              for chart in json.loads(os.environ['CHARTS']):
                  metadata_path = f'{chart}/Chart.yaml'
                  existing = subprocess.check_output(
                      ['git', 'ls-tree', '--name-only', before, '--', metadata_path], text=True
                  ).strip()
                  if not existing:
                      continue
                  old_metadata = subprocess.check_output(
                      ['git', 'show', f'{before}:{metadata_path}'], text=True
                  )
                  with tempfile.TemporaryDirectory() as temporary:
                      Path(temporary, 'Chart.yaml').write_text(old_metadata)
                      old_version = version(temporary)
                  new_version = version(chart)
                  if precedence(new_version) <= precedence(old_version):
                      raise SystemExit(
                          f'{chart}: version must increase before publishing '
                          f'({old_version} -> {new_version})'
                      )
          PY

      - name: Package and push charts
        if: steps.charts.outputs.charts != '[]'
        shell: bash
        env:
          CHARTS: ${{ steps.charts.outputs.charts }}
          BEFORE: ${{ github.event.before }}
          REPOSITORY: ${{ github.repository }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import tarfile
          import tempfile

          def chart_metadata(archive):
              output = subprocess.check_output(['helm', 'show', 'chart', str(archive)], text=True)
              fields = {}
              for key in ('name', 'version'):
                  matches = re.findall(rf'^{key}:\s*(\S+)\s*$', output, re.MULTILINE)
                  if len(matches) != 1:
                      raise SystemExit(f'Expected one {key} in {archive}')
                  fields[key] = matches[0].strip('"\'')
              return fields['name'], fields['version']

          def archive_contents(archive):
              with tarfile.open(archive, 'r:gz') as contents:
                  return {
                      member.name: (
                          member.type,
                          member.mode,
                          member.linkname,
                          contents.extractfile(member).read() if member.isfile() else b'',
                      )
                      for member in contents.getmembers()
                  }

          charts = json.loads(os.environ['CHARTS'])
          if not charts:
              raise SystemExit(0)
          destination = 'oci://ghcr.io/' + os.environ['REPOSITORY'].lower() + '/charts'
          with tempfile.TemporaryDirectory() as temporary:
              root = Path(temporary)
              packages = []
              for index, chart in enumerate(charts):
                  directory = root / str(index)
                  directory.mkdir()
                  subprocess.run(['helm', 'package', chart, '--destination', str(directory)], check=True)
                  archives = list(directory.glob('*.tgz'))
                  if len(archives) != 1:
                      raise SystemExit(f'Expected one chart archive for {chart}')
                  packages.append((chart, archives[0]))
              env = dict(os.environ, HELM_REGISTRY_CONFIG=str(root / 'registry.json'))
              subprocess.run(['helm', 'registry', 'login', 'ghcr.io',
                              '--username', os.environ['REGISTRY_USER'], '--password-stdin'],
                             input=os.environ['REGISTRY_TOKEN'] + '\n', text=True, env=env, check=True)
              to_push = []
              before = os.environ['BEFORE']
              for index, (chart, archive) in enumerate(packages):
                  name, version = chart_metadata(archive)
                  metadata_path = f'{chart}/Chart.yaml'
                  prior_chart = before != '0' * 40 and subprocess.check_output(
                      ['git', 'ls-tree', '--name-only', before, '--', metadata_path], text=True
                  ).strip()
                  if prior_chart:
                      remote = root / f'remote-{index}'
                      remote.mkdir()
                      result = subprocess.run(
                          ['helm', 'pull', f'{destination}/{name}', '--version', version,
                           '--destination', str(remote)],
                          env=env, text=True, capture_output=True
                      )
                      if result.returncode == 0:
                          existing = list(remote.glob('*.tgz'))
                          if len(existing) != 1:
                              raise SystemExit(f'Expected one published chart for {chart}')
                          if archive_contents(existing[0]) != archive_contents(archive):
                              raise SystemExit(f'{chart}: published version {version} has different contents')
                          print(f'{chart}: version {version} already matches; skipping push')
                          continue
                      if not result.stderr.strip().endswith(': not found'):
                          raise SystemExit(f'{chart}: unable to check published version: {result.stderr.strip()}')
                  to_push.append(archive)
              for archive in to_push:
                  subprocess.run(['helm', 'push', str(archive), destination], env=env, check=True)
          PY
