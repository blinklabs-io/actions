name: Test governance controller

on:
  pull_request:
    paths:
      - 'app/**'
      - 'templates/**'
      - 'repos-config.yaml'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'templates/**'
      - 'repos-config.yaml'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l app)"
      - name: Test
        run: go test -race ./app -count=1 -timeout=10m
      - name: Vet
        run: go vet ./app
      - name: Build
        run: go build -o "$RUNNER_TEMP/governance" ./app
