name: Reuseable Docker CI (Multi-arch Native)

# Runs a per-arch Docker build-only CI check using native runners (no QEMU).
# Intended for repositories whose publish workflow uses native arm64 runners
# and separate per-arch build jobs rather than QEMU-based multi-platform builds.

on:
  workflow_call:
    inputs:
      image-name:
        description: >
          Container image name without registry prefix
          (e.g. blinklabs-io/cardano-cli).
        required: true
        type: string
      build-target:
        description: >
          Dockerfile build target (stage name) passed as --target.
          Leave empty to build the default (last) stage.
        required: false
        type: string
        default: ""
      architectures:
        description: >
          JSON array of architectures to build, each on its native runner. Only amd64 and arm64 are accepted.
          Use '["amd64"]' for an image that is only published for amd64.
        required: false
        type: string
        default: '["amd64","arm64"]'
      build-args:
        description: Build ARG values passed to the Docker build (multi-line KEY=VALUE pairs).
        required: false
        type: string
        default: ""
      check-dockerfile:
        description: Run `docker build --check` against the Dockerfile before building.
        required: false
        type: boolean
        default: false
      timeout-minutes:
        description: Job backstop against a wedged runner.
        required: false
        type: number
        default: 360

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        arch: ${{ fromJson(inputs.architectures) }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - name: Validate architecture
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          # The runner and tag suffix below are only defined for these two.
          case "$ARCH" in
            amd64|arm64) ;;
            *) echo "::error::unsupported architecture '$ARCH'; use amd64 or arm64"; exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          fetch-depth: '0'
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1 https://github.com/docker/setup-buildx-action/releases/tag/v4.4.1

      - name: Check Dockerfile
        if: inputs.check-dockerfile
        env:
          BUILD_TARGET: ${{ inputs.build-target }}
          BUILD_ARGS: ${{ inputs.build-args }}
        run: |
          _flags=()
          if [ -n "$BUILD_TARGET" ]; then
            _flags+=(--target "$BUILD_TARGET")
          fi
          while IFS= read -r _arg; do
            [ -z "$_arg" ] && continue
            _flags+=(--build-arg "$_arg")
          done <<< "$BUILD_ARGS"
          docker build --check "${_flags[@]}" .

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0 https://github.com/docker/metadata-action/releases/tag/v6.2.0
        with:
          images: ghcr.io/${{ inputs.image-name }}
          flavor: |
            latest=false
            suffix=-${{ matrix.arch == 'arm64' && 'arm64v8' || 'amd64' }}

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0 https://github.com/docker/build-push-action/releases/tag/v7.4.0
        with:
          context: .
          push: false
          target: ${{ inputs.build-target }}
          build-args: ${{ inputs.build-args }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=buildkit-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=buildkit-${{ matrix.arch }}
