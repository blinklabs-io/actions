name: Reuseable Docker CI (Multi-arch Native)

# Runs a per-arch Docker build-only CI check using native runners (no QEMU).
# Intended for repositories whose publish workflow uses native arm64 runners
# and separate per-arch build jobs rather than QEMU-based multi-platform builds.

on:
  workflow_call:
    inputs:
      image-name:
        description: >
          Container image name without registry prefix
          (e.g. blinklabs-io/cardano-cli).
        required: true
        type: string
      build-target:
        description: >
          Dockerfile build target (stage name) passed as --target.
          Leave empty to build the default (last) stage.
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          fetch-depth: '0'
          persist-credentials: false

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0 https://github.com/docker/setup-buildx-action/releases/tag/v4.3.0

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0 https://github.com/docker/metadata-action/releases/tag/v6.2.0
        with:
          images: ghcr.io/${{ inputs.image-name }}
          flavor: |
            latest=false
            suffix=-${{ matrix.arch == 'arm64' && 'arm64v8' || 'amd64' }}

      - name: Build Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0 https://github.com/docker/build-push-action/releases/tag/v7.3.0
        with:
          context: .
          push: false
          target: ${{ inputs.build-target }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=buildkit-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=buildkit-${{ matrix.arch }}
